<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one phone column; Commons-green bench as the table, order-paper cards in a docked hand at the bottom. Single deliberate dark theme. */
:root{
  --bench:#0d2a21; --bench-2:#13382c; --bench-3:#1b4738; --line:rgba(226,214,168,.17);
  --ink:#eef0e5; --muted:#a6bba9; --brass:#d8b257; --brass-ink:#1c1606;
  --paper:#f3efe3; --paper-2:#e8e2d1; --paper-ink:#1d221e; --paper-muted:#5b6157;
  --gov:#d8b257; --opp:#ee9479; --fp:#ae9ff4; --pm:#f1cf72; --alert:#ff8a76;
  --f-display:"Alegreya SC", "Iowan Old Style", Georgia, serif;
  --f-ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bench);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background-image:radial-gradient(120% 60% at 50% 0%, rgba(216,178,87,.07), transparent 70%);background-attachment:fixed}
#app{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
em{font-style:normal;color:var(--brass);font-size:12px;margin-left:4px}

/* buttons */
.btn{display:block;width:100%;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:transparent;font-weight:600;font-size:15px;text-align:center}
.btn.brass{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary{background:var(--ink);color:var(--bench);border-color:var(--ink);width:auto;padding-inline:20px}
.btn.ghost{background:rgba(255,255,255,.03)}
.linkish{background:none;border:0;color:var(--brass);text-decoration:underline;text-underline-offset:3px;padding:0}

/* home */
.home{padding-block:clamp(28px,8vh,72px) 40px;display:grid;gap:28px;max-width:460px;margin:0 auto}
.mast h1{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,13vw,72px);line-height:.95;letter-spacing:.01em;margin:10px 0 14px;color:var(--ink)}
.mast h1::after{content:"";display:block;width:64px;height:3px;background:var(--brass);margin-top:16px}
.lede{color:var(--muted);font-size:16px;max-width:40ch;margin:0}
.panel{display:grid;gap:12px;background:var(--bench-2);border:1px solid var(--line);border-radius:14px;padding:18px}
.field{display:grid;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;font-size:17px;letter-spacing:normal;text-transform:none;color:var(--ink);background:var(--bench);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0}
#code{font-family:var(--f-mono);letter-spacing:.3em;text-transform:uppercase}
.join-row{display:flex;gap:10px;align-items:end}.grow{flex:1;min-width:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* lobby */
.lobby{padding-block:32px 40px;display:grid;gap:20px;max-width:460px;margin:0 auto}
.lobby-head{text-align:center;display:grid;gap:8px}
.code{font-family:var(--f-mono);font-size:56px;letter-spacing:.24em;margin:0;color:var(--pm);font-weight:500;padding-left:.24em}
.panel h2{font-family:var(--f-display);font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 .muted{font-family:var(--f-ui);font-size:13px}
.roll{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:m}
.roll li{counter-increment:m;padding:8px 10px;border-radius:8px;background:var(--bench);display:flex;gap:8px}
.roll li::before{content:counter(m);font-family:var(--f-mono);color:var(--muted);width:1.5em}
.roll .botline{color:var(--muted);font-style:italic}.roll .botline::before{content:"+"}
.countrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.segs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg{background:none;border:0;padding:8px 16px;font-family:var(--f-mono)}
.seg.on{background:var(--brass);color:var(--brass-ink)}

/* waiting */
.waiting{padding-block:80px;display:grid;gap:14px;max-width:420px;margin:0 auto;text-align:center}
.waiting h2{font-family:var(--f-display);font-size:28px}

/* game */
.game{padding-bottom:calc(var(--dock, 260px) + 14px)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bench);border-bottom:1px solid var(--line);font-size:13px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bench)}
.bar-code{font-family:var(--f-mono);letter-spacing:.18em;color:var(--pm)}
.bar-deck{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:6px;background:var(--bench-3)}
.clock.low{background:var(--alert);color:#2a0b05}.clock.paused{color:var(--muted)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted)}
.alert{margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(255,138,118,.14);color:var(--alert);font-size:14px}


.camp-G{--camp:var(--gov)} .camp-O{--camp:var(--opp)} .camp-F{--camp:var(--fp)}
.seat{border-color:color-mix(in srgb, var(--camp) 40%, transparent);background:color-mix(in srgb, var(--camp) 11%, var(--bench-2))}
.seat .sname{color:var(--camp)}
.seat.is-pm{border-width:2px;border-color:var(--camp)}
.seat.is-me{background:color-mix(in srgb, var(--camp) 20%, var(--bench-2))}
.seat.is-cur{box-shadow:0 0 0 2px var(--ink);position:relative}
.seat.is-out{opacity:.45}
.seat.is-pick{border-color:var(--ink);border-style:dashed;cursor:pointer}
.seat.is-pick:hover{transform:translateY(-1px)}
.seat.is-picked{background:rgba(216,178,87,.18);border-style:solid}
.sname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.role{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.r-PM{color:var(--gov);font-weight:600;border-width:2px} .r-G{color:var(--gov)} .r-O{color:var(--opp)} .r-F{color:var(--fp)}
.handct{font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.06)}
.tag.me{color:var(--brass)} .tag.warn{color:var(--alert)} .tag.open{color:var(--fp)}
.bills,.openhand,.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;line-height:1.2;padding:3px 7px 3px 9px;border-radius:4px;background:var(--paper);color:var(--paper-ink);border:0;border-left:4px solid var(--band, #888);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip-act{border-left-color:var(--paper-muted);background:var(--paper-2)}
.billchip{font-weight:600}

.feed{margin-top:12px;display:grid;gap:6px}
.banner{margin:0;padding:10px 12px;border-radius:8px;background:var(--bench-2);border:1px solid var(--line)}
.banner p{margin:0}
.banner.mine{border-color:var(--brass);color:var(--pm)}
.banner.aim{background:rgba(216,178,87,.14);border-color:var(--brass)}
.banner.resp{display:grid;gap:8px}
.chain{margin:0;padding-left:20px;font-size:13px;color:var(--muted)}
.lastlog{margin:0;font-size:13px;color:var(--muted);font-style:italic}

.tbar{position:relative;height:18px;border-radius:9px;background:var(--bench);overflow:hidden}
.tbar i{position:absolute;inset:0;background:var(--brass);transform-origin:left;opacity:.55}
.tbar span{position:absolute;right:8px;top:0;font-family:var(--f-mono);font-size:11px;line-height:18px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top, var(--bench) 70%, rgba(13,42,33,.94));border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:grid;gap:8px}
.dock > *{max-width:980px;width:100%;margin:0 auto;min-width:0}
.dock-head{display:flex;gap:10px;align-items:center;font-size:13px;min-width:0}
.goal{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hand-scroll{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.dock-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dock-actions .btn{padding:10px}
.empty{padding:30px 0}

/* cards */
.card{flex:none;width:100px;height:162px;border-radius:9px;background:var(--paper);color:var(--paper-ink);border:0;padding:0;display:flex;flex-direction:column;text-align:left;overflow:hidden;scroll-snap-align:start;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card.is-sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--brass),0 6px 14px rgba(0,0,0,.4)}
.c-band{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--band);color:#fff;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.c-set{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--paper-ink);font-weight:600;letter-spacing:0}
.c-name{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.1;padding:3px 8px 0}
.c-foot{margin-top:auto;padding:6px 8px;font-size:11px;color:var(--paper-muted);border-top:1px dashed rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.card.is-ready .c-foot{color:#1d6b3a;font-weight:600}
.card.act .c-kind{padding:6px 8px 0;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)}
.card.k-d{background:var(--paper-2)}
.card.k-d .c-kind{color:#7a2e22}
.c-text{padding:3px 8px 7px;font-size:10.5px;line-height:1.2;color:var(--paper-muted);overflow:hidden}

/* sheets & modals */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(4,14,10,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--bench-2);border-radius:16px 16px 0 0;border:1px solid var(--line);
  padding:22px max(18px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.sheet h2{font-family:var(--f-display);font-size:26px;padding-right:70px}
.sheet h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.sheet p{margin:0}
.sheet-x{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
.bigcard{display:flex;justify-content:center}
.bigcard .card{width:170px;height:290px}.bigcard .c-art svg{width:104px;height:104px}
.bigcard .c-name{font-size:19px}.bigcard .c-text{font-size:13px}
.flav{font-style:italic;color:var(--muted)}
.note{padding:10px 12px;border-radius:8px;background:var(--bench);color:var(--muted)}
.warnline{color:var(--alert);font-size:14px;margin:0}
.rules{margin:0;padding-left:18px;display:grid;gap:6px}
.rules.plain{list-style:none;padding:0}
.kindtag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.hansard{margin:0;padding-left:20px;display:grid;gap:8px}
.stack{display:grid;gap:8px}.billopt{display:flex;gap:10px;align-items:center;text-align:left}
.partners{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--bench);border-radius:999px;padding:7px 12px;font-size:14px}
.pill small{color:var(--muted);margin-left:4px}
.pill.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.pill.on small{color:var(--brass-ink)}
.pill[class*=camp-]{border-color:color-mix(in srgb, var(--camp) 55%, transparent);color:var(--camp)}
.pill[class*=camp-].on{background:var(--camp);color:var(--brass-ink);border-color:var(--camp)}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.minis .card{width:88px;height:150px}.minis .c-art svg{width:46px;height:46px}
.minis .c-text{display:none}
.wants{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.want{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px;border-radius:6px;min-width:0}
.want.on{background:rgba(216,178,87,.14)}
.want .chip{min-width:0}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bench)}
.step b{font-family:var(--f-mono);min-width:1ch;text-align:center}
.sheet-foot{position:sticky;bottom:0;padding-top:8px;background:var(--bench-2)}

.modal{position:fixed;inset:0;z-index:15;background:rgba(4,14,10,.7);display:flex;align-items:center;justify-content:center;padding:16px max(16px, env(safe-area-inset-right,0px)) 16px max(16px, env(safe-area-inset-left,0px))}
.mbox{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--bench-2);border:1px solid var(--brass);border-radius:14px;padding:20px;display:grid;gap:12px}
.mbox.wide{max-width:600px}
.mbox h2{font-family:var(--f-display);font-size:22px;line-height:1.15}
.mbox h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mbox p{margin:0}
.mrow{display:flex;gap:8px;flex-wrap:wrap}.mrow .btn{flex:1;min-width:140px}
.counters{display:grid;gap:8px}
.btn.counter{text-align:left;display:grid;gap:2px;background:var(--paper);color:var(--paper-ink);border-color:var(--paper)}
.btn.counter small{font-weight:400;color:var(--paper-muted)}
.tradecols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tradecols > div{display:grid;gap:6px;align-content:start;min-width:0}
.times{font-family:var(--f-mono);font-size:12px;margin-right:6px}
.over .mbox{max-width:480px;text-align:center}
.win{font-size:40px!important}
.w-G{color:var(--gov)} .w-O{color:var(--opp)} .w-F{color:var(--fp)}
.results{list-style:none;margin:0;padding:0;display:grid;gap:4px;text-align:left}
.results li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--bench)}
.results li.won{background:rgba(216,178,87,.16)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock, 260px) + 12px);z-index:30;background:var(--ink);color:var(--bench);padding:10px 14px;border-radius:8px;font-size:14px;max-width:min(92vw,420px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.home ~ .toast,.lobby ~ .toast,.waiting ~ .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

.pop{position:fixed;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(4,14,10,.55);padding-inline:16px}
.popbox{display:grid;justify-items:center;gap:12px;text-align:center;animation:popin .35s ease-out}
.pop-who{margin:0;font-family:var(--f-display);font-size:22px;color:var(--camp)}
.pop-on{margin:0;font-size:16px;max-width:30ch}
.popcard{width:180px;height:300px;box-shadow:0 0 0 3px var(--camp),0 14px 40px rgba(0,0,0,.5)}
.popcard .c-name{font-size:21px}.popcard .c-text{font-size:13.5px}
@keyframes popin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.card.wild{background:linear-gradient(160deg,var(--paper) 55%,#efe3bf)}
.card.wild .c-band{background:linear-gradient(90deg,#7a5aa8,#c4583c,#2f8a88,#a07d22)}
.card.wild .c-text{padding-top:6px}
.chip-wild{border-left-color:transparent;border-image:linear-gradient(#7a5aa8,#c4583c,#a07d22) 1;font-weight:600}
.billopt small{margin-left:auto}

.popcard.elec{background:#ece6f8;box-shadow:0 0 0 3px var(--fp),0 14px 40px rgba(0,0,0,.5)}
.popcard.elec .c-kind{color:#4b3a8a}

.c-art{display:grid;place-items:center;padding-top:4px;flex:none}
.c-art svg{width:58px;height:58px;display:block}
.popcard .c-art svg{width:108px;height:108px}
.card.bill .c-foot{margin-top:auto}
.chip-i{width:14px;height:14px;vertical-align:-3px;margin-right:4px;display:inline-block}
.chip{display:inline-flex;align-items:center}
.billchip .chip-i{width:15px;height:15px}

.modal.paused{z-index:18;background:rgba(4,14,10,.82)}
.modal.paused .mbox{text-align:center;border-color:var(--pm)}
.modal.paused h2{font-size:28px}
.pausebtn{color:var(--pm);border-color:color-mix(in srgb, var(--pm) 55%, transparent)}

/* compact table: score line + player tiles */
.scores{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--bench-2);font-size:12px;color:var(--muted);white-space:nowrap}
.score b{font-family:var(--f-display);font-size:17px;line-height:1;font-variant-numeric:tabular-nums;margin-left:2px}
.score small{font-size:12px;color:var(--muted)}
.s-G b{color:var(--gov)} .s-O b{color:var(--opp)} .s-F b{color:var(--fp)}
@media (max-width:360px){.scores{font-size:11px}}
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.seats.c4{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.seat{border:1px solid var(--line);border-radius:8px;padding:5px 6px;display:grid;gap:2px;align-content:start;min-width:0;cursor:pointer;transition:border-color .15s}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:4px;min-width:0}
.t-flags{display:flex;gap:3px;min-width:0;overflow:hidden}
.seat .role{font-size:9px;padding:1px 4px;letter-spacing:.04em}
.sname{font-size:13px;line-height:1.2}
.t-bot{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:18px;min-width:0}
.handct{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.cardglyph{display:inline-block;width:9px;height:12px;border-radius:2px;background:var(--paper);box-shadow:2px -2px 0 -0.5px var(--paper-2)}
.t-bills{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.t-bill{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--paper);box-shadow:inset 0 -2px 0 var(--band)}
.t-bill .chip-i{width:14px;height:14px;margin:0;vertical-align:0}
.flag{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;padding:1px 3px;border-radius:3px;background:rgba(255,255,255,.08);color:var(--muted)}
.flag.me{color:var(--brass)} .flag.warn{color:var(--alert)} .flag.open{color:var(--fp)}
.seat.is-cur{box-shadow:0 0 0 2px var(--ink),0 0 14px rgba(241,207,114,.35)}
.seats.c4 .sname{font-size:12px}
.seats.c4 .seat{padding:5px}
.seat-title{color:var(--camp)} .seat-title small{font-size:14px;color:var(--muted)}
/* banner and last event share one box */
.feed{margin-top:8px;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--bench-2);padding:8px 10px}
.feed .banner{padding:0;border:0;background:none;border-radius:0}
.feed .banner.mine{color:var(--pm)}
.feed:has(.banner.mine){border-color:var(--brass)}
.feed:has(.banner.aim){border-color:var(--brass);background:color-mix(in srgb, var(--brass) 14%, var(--bench-2))}
.feed .lastlog{margin-top:4px;font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed .banner.resp{gap:6px}
.feed .chain{font-size:12px}
/* shorter hand dock */
.dock{gap:6px;padding-top:8px}
.dock-head{font-size:12px}
.hand-scroll{padding:4px 2px 6px}
.dock-actions .btn{padding:8px;font-size:14px}
.hand-scroll .card{width:94px;height:146px}
.hand-scroll .c-art svg{width:50px;height:50px}
.hand-scroll .c-name{font-size:12.5px}
.hand-scroll .c-text{font-size:10px}

.seat .sname{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.seats.c4 .sname{font-size:11.5px}
.hand-scroll .c-foot{font-size:10.5px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bot level picker */
.lvlwrap{display:grid;gap:6px}
.lvl-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvlpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lvl{display:grid;gap:2px;align-content:center;text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bench)}
.lvl b{font-size:13px;line-height:1.15;font-weight:600}
.lvl small{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lvl.on{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.lvl.on small{color:var(--brass-ink)}
/* quick guide */
.brief{position:fixed;inset:0;z-index:17;overflow-y:auto;background:var(--bench);-webkit-overflow-scrolling:touch}
.brief-in{max-width:560px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:grid;gap:14px}
.brief-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;background:var(--bench);border-bottom:1px solid var(--line)}
.brief-clock{flex:1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.brief-skip{width:auto;padding:6px 16px}
.g-pic{width:56px;height:56px;display:block;flex:none}
.g-you{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;border:2px solid var(--camp);background:color-mix(in srgb, var(--camp) 14%, var(--bench-2))}
.g-you .g-pic{width:72px;height:72px;background:var(--paper);border-radius:10px;padding:4px}
.g-you h2{font-family:var(--f-display);font-size:24px;line-height:1.1;margin:2px 0 6px;color:var(--camp)}
.g-you p{margin:0}
.g-sec{display:grid;gap:10px;padding-top:4px}
.g-sec h3{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.g-sec p{margin:0}
.g-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g-three > div{display:grid;justify-items:center;align-content:start;gap:4px;text-align:center;padding:10px 6px;border-radius:10px;background:var(--bench-2);border:1px solid var(--line);min-width:0}
.g-three > div[class*=camp-]{border-color:color-mix(in srgb, var(--camp) 55%, transparent);background:color-mix(in srgb, var(--camp) 10%, var(--bench-2))}
.g-three .g-pic{background:var(--paper);border-radius:8px;padding:3px}
.g-three b{font-size:13.5px;line-height:1.15}
.g-three [class*=camp-] b{color:var(--camp)}
.g-three span{font-size:12px;color:var(--muted);line-height:1.25}
.g-win span{font-size:14px;color:var(--ink);font-weight:600}
.g-win em{font-size:12px;font-style:normal;color:var(--muted);line-height:1.25}
.g-strip{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px;border-radius:10px;background:var(--bench-2);border:1px solid var(--line)}
.g-step{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.g-step b{font-size:12.5px}
.g-step .g-pic{background:var(--paper);border-radius:8px;padding:3px}
.g-arrow{color:var(--brass);font-size:22px;flex:none}
.g-moves{display:flex;gap:4px;height:56px;align-items:center}
.g-moves i{display:grid;place-items:center;width:28px;height:38px;border-radius:5px;background:var(--paper);color:var(--paper-ink);font:700 16px var(--f-display);font-style:normal;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.g-end{display:grid;place-items:center;height:56px;padding:0 12px;border-radius:8px;border:2px solid var(--brass);color:var(--brass);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.g-foot{display:grid;gap:8px;padding-top:6px;text-align:center}
.sheet .g-sec h3{font-size:18px;letter-spacing:normal;text-transform:none;margin-top:0}
</style>
</head>

<div id="app"></div>
<script>
/* ===== Order! Order! rules engine (runs on the host device) ===== */
const BILLS = [
  {k:'E', name:'Environment Protection Bill', short:'Environment', set:3, col:'#4f8f5e'},
  {k:'R', name:'Railway Reform Bill', short:'Railways', set:3, col:'#b8732f'},
  {k:'O', name:'Online Safety Bill', short:'Online Safety', set:4, col:'#3f7fb0'},
  {k:'L', name:'Electoral Reform Bill', short:'Electoral Reform', set:4, col:'#a54a7c'},
  {k:'F', name:'Freedom of Information Bill', short:'Freedom of Info', set:4, col:'#7d7232'},
  {k:'B', name:'Bill of Rights Bill', short:'Bill of Rights', set:5, col:'#c4583c'},
  {k:'D', name:'Devolution Bill', short:'Devolution', set:5, col:'#2f8a88'},
  {k:'H', name:'Lords Reform Bill', short:'Lords Reform', set:5, col:'#8e2433'},
  {k:'I', name:'Investigatory Powers Bill', short:'Investigatory', set:5, col:'#56627f'},
  {k:'C', name:'Constitutional Reform Bill', short:'Const. Reform', set:5, col:'#6c4f9c'},
  {k:'K', name:'Codified Constitution', short:'Codified Const.', set:6, col:'#a07d22'},
  {k:'Y', name:'Dangerous Dogs Bill', short:'Dangerous Dogs', set:3, col:'#6e5442'},
  {k:'W', name:'Clean Water Bill', short:'Clean Water', set:3, col:'#2a93bd'},
  {k:'P', name:'Cannabis Bill', short:'Cannabis', set:4, col:'#58872a'},
  {k:'M', name:'Land Reform Bill', short:'Land Reform', set:4, col:'#946226'},
];
const WILD = {name:'Henry VIII Clause', short:'Henry VIII', text:'Wild card. Fills the slot of any bill when you pass it. Every set needs at least one real bill card.', flav:'A minister amends an Act by delegated legislation.'};
const BILL = Object.fromEntries(BILLS.map(b => [b.k, b]));

/* kind: m = manoeuvre (costs a move, on your turn), d = defence (played in response) */
const ACTS = {
  larry:{name:'Larry the Chief Mouser', kind:'m', tgt:'none', n:8, x:1, text:'Draw 2 more cards from the deck. Cannot be stopped.', flav:'Chief Mouser to the Cabinet Office since 2011.'},
  lr:{name:'Lords’ Rejection', kind:'m', tgt:'bill', n:8, x:1, text:'Choose a player with a bill passed by the Commons. The Lords reject it and it is knocked out.', flav:'The second chamber votes the bill down.'},
  coal:{name:'Coalition Agreement', kind:'m', tgt:'two', n:6, x:1, text:'Choose two other players. Take one random card from each of their hands.', flav:'Two parties, one programme for government.'},
  talks:{name:'Cross-Party Talks', kind:'m', tgt:'one', n:6, x:1, text:'Choose a player and see their hand. Swap up to 2 of your cards for 2 of theirs.', flav:'Cards on the table.'},
  vonc:{name:'Vote of No Confidence', kind:'m', tgt:'vonc', n:5, x:1, text:'Knock out one of a player’s Commons-passed bills. If they have none, they are eliminated. Only after the first bill of the game has passed.', flav:'The Commons withdraws its confidence. Unfinished bills fall at dissolution.'},
  fund:{name:'Party Funding', kind:'m', tgt:'none', n:4, x:1, text:'Every other player must give you one card of their choice.', flav:'Everyone chips in.'},
  inq:{name:'Select Committee Inquiry', kind:'m', tgt:'one', n:5, x:0, text:'Choose a player. They play with their hand open until your next turn.', flav:'Evidence is taken in public.'},
  cs:{name:'Confidence and Supply', kind:'m', tgt:'bill', n:4, x:1, text:'Take one Commons-passed bill from any player. It now counts for you.', flav:'A smaller party props up the government, at a price.'},
  pa:{name:'Parliament Acts 1911 & 1949', kind:'d', vs:['lr'], n:6, x:1, text:'Cancel a Lords’ Rejection.', flav:'The Lords can only delay. Jackson v AG (2005) upheld the 1949 Act.'},
  ri:{name:'Royal Intervention', kind:'d', vs:['lr'], n:2, x:0, text:'Cancel a Lords’ Rejection and turn it back on the player who used it.', flav:'1911: the threat to create new peers, on the Prime Minister’s advice, made the Lords give way.'},
  jr:{name:'Judicial Review', kind:'d', vs:['self'], n:6, x:0, text:'Answer any action card aimed at you. Guess whether the top card of the deck is a bill or an action card. Right: the card is cancelled for you. A Henry VIII Clause means you lose; Election Interference means you win.', flav:'Only an aggrieved party with sufficient interest may bring a claim.'},
  diss:{name:'Dissolution of Parliament', kind:'d', vs:['vonc'], n:4, x:1, text:'Block a Vote of No Confidence.', flav:'Dissolution and Calling of Parliament Act 2022.'},
  pror:{name:'Prorogation of Parliament', kind:'d', vs:['vonc'], n:3, x:0, text:'Block a Vote of No Confidence. You must discard your whole hand.', flav:'Miller No 2 (2019): prorogation that frustrates Parliament is unlawful.'},
  sov:{name:'Parliamentary Sovereignty', kind:'d', vs:['*'], n:6, x:1, text:'Cancel an action card against you, or shield another targeted player. Against a card that hits several players, it protects only the one shielded. It also cancels a defence card outright.', flav:'Dicey: Parliament can make or unmake any law whatever.'},
};
const ROLE = {
  PM:{name:'Prime Minister', side:'G'},
  G:{name:'Government MP', side:'G'},
  O:{name:'Opposition MP', side:'O'},
  F:{name:'Foreign Power', side:'F'},
};
const SIDE = {G:'Government', O:'Opposition', F:'Foreign Power'};
const NEED = {G:3, O:2, F:3};
const LAYOUT = {6:['PM','G','G','O','O','F'], 7:['PM','G','G','G','O','O','F'], 8:['PM','G','G','G','O','O','O','F']};
const TIME = {turn:120000, resp:30000, pop:2600, talks:30000, fund:15000, trade:20000, elec:30000};
const ELEC = {name:'Election Interference', text:'Played the moment it is drawn, and the draw is lost. It cannot be stopped. The Foreign Power looks at the top 10 cards of the deck and takes 5. The rest are shuffled back.', flav:'Foreign money and bots in the marginal seats.'};
const PAUSE_LOCK = 30000, BRIEF_MS = 90000;
const BOT = {move:4000, jitter:800, react:3000, reactJ:3000, answer:3500};

const _cats = {};
function catalog(n){
  if (_cats[n]) return _cats[n];
  const c = [];
  BILLS.forEach(b => { for (let i = 0; i < b.set + 2; i++) c.push({t:'b', k:b.k}); });
  for (let i = 0; i < 10 + (n - 6); i++) c.push({t:'w', k:'wild'});
  for (let i = 0; i < 5; i++) c.push({t:'e', k:'elec'});
  Object.entries(ACTS).forEach(([k, a]) => { const cnt = a.n + a.x * (n - 6); for (let i = 0; i < cnt; i++) c.push({t:'a', k}); });
  return (_cats[n] = c);
}
function cardType(n, id){ return catalog(n)[id].k; }
function typeName(k){ return k === 'elec' ? ELEC.name : k === 'wild' ? WILD.name : BILL[k] ? BILL[k].name : ACTS[k].name; }
function cardName(n, id){ return typeName(catalog(n)[id].k); }
function canCounter(k, topA){ const d = ACTS[k]; return !!d && d.kind === 'd' && k !== 'jr' && (d.vs.includes('*') || d.vs.includes(topA)); }
/* Judicial Review: only the aggrieved player, only while the card aimed at them is in force */
function jrAllowed(sub, si){
  if (!sub.base.tg.includes(si) || sub.base.src === si) return false;
  if (sub.mt){ const ch = sub.sh[si] || []; return ch.length % 2 === 0 && (ch.length ? ch[ch.length - 1][1] : sub.base.src) !== si; }
  const topS = sub.chain.length ? sub.chain[sub.chain.length - 1].s : sub.base.src;
  return sub.chain.length % 2 === 0 && topS !== si;
}
function jrReveal(S, guess, env){
  ensureDeck(S, env);
  if (!S.deck.length) return {k:null, ok:false};
  const id = S.deck.pop(); S.disc.push(id);
  const c = catalog(S.n)[id];
  const ok = c.t === 'e' ? true : c.t === 'w' ? false : (c.t === 'b') === (guess === 'b');
  return {k:c.k, ok};
}
function sideOf(role){ return ROLE[role].side; }

function shuffle(a, rand){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function log(S, m){ S.log.push(m); while (S.log.length > 7) S.log.shift(); }
function nm(S, i){ return S.seats[i].nm; }

function newGame(code, humans, n, env, lvl){
  const roles = shuffle(LAYOUT[n].slice(), env.rand);
  const spots = shuffle([...Array(n).keys()], env.rand);
  const seats = roles.map(r => ({nm:'', cid:null, bot:true, role:r, hand:[], bills:[], out:false, op:-1}));
  humans.slice(0, n).forEach((h, i) => { const s = seats[spots[i]]; s.nm = h.nm; s.cid = h.cid; s.bot = false; });
  const seen = {G:0, O:0};
  seats.forEach(s => {
    const k = s.role === 'G' || s.role === 'O' ? ++seen[s.role] : 0;
    if (s.bot) s.nm = s.role === 'PM' ? 'Prime Minister' : s.role === 'F' ? 'Foreign Power' : (s.role === 'G' ? 'Govt MP ' : 'Opposition MP ') + k;
  });
  const S = {v:1, code, n, ph:'play', seats, deck:shuffle(catalog(n).map((_, i) => i), env.rand), disc:[],
    cur:seats.findIndex(s => s.role === 'PM'), mv:3, fb:false, sub:null, turnDl:0, turnLeft:0, log:[], win:null,
    ak:{}, er:{}, botAt:0, humans:humans.slice(0, n)};
  seats.forEach(s => { for (let k = 0; k < 4; k++) drawOne(S, s, env); });
  S.lvl = lvl === 0 || lvl === 2 ? lvl : 1;
  const bots = seats.filter(s => s.bot).length;
  log(S, `The House is in session. The Prime Minister opens.${bots ? ` Bots play as ${LEVELS[S.lvl]} (${LEVEL_TAG[S.lvl].toLowerCase()}).` : ''}`);
  startTurn(S, S.cur, env);
  S.brief = {t0:env.now, until:env.now + BRIEF_MS, ready:{}};
  return S;
}

function ensureDeck(S, env){
  if (S.deck.length <= 10 && S.disc.length){
    S.deck = shuffle(S.deck.concat(S.disc), env.rand); S.disc = [];
    log(S, 'The discard pile was shuffled back into the deck.');
  }
}
function drawOne(S, seat, env){
  ensureDeck(S, env); if (!S.deck.length) return;
  const id = S.deck.pop();
  if (catalog(S.n)[id].t !== 'e'){ seat.hand.push(id); return; }
  S.disc.push(id);
  const fp = S.seats.find(x => x.role === 'F' && !x.out);
  if (!fp){ log(S, `${seat.nm} draws Election Interference, but the Foreign Power has lost its seat. No effect.`); return; }
  log(S, `${seat.nm} draws Election Interference!`);
  S.elecQ = (S.elecQ || 0) + 1;
}
function openElection(S, env){
  S.elecQ--;
  const fi = S.seats.findIndex(x => x.role === 'F' && !x.out);
  if (fi < 0) return;
  ensureDeck(S, env);
  const cards = S.deck.splice(Math.max(0, S.deck.length - 10)).filter(x => catalog(S.n)[x].t !== 'e' || (S.disc.push(x), false));
  if (!cards.length) return;
  pauseTurn(S, env);
  S.sub = {k:'elec', src:fi, cards, n:Math.min(5, cards.length), dl:env.now + TIME.pop + TIME.elec, at0:env.now};
}
function finishElection(S, si, a, env){
  const sub = S.sub;
  if (!sub || sub.k !== 'elec' || sub.src !== si) return 'There is no election to interfere in.';
  const pick = [...new Set(Array.isArray(a.pick) ? a.pick : [])].filter(id => sub.cards.includes(id));
  if (pick.length !== sub.n) return `Choose exactly ${sub.n} cards.`;
  closeElection(S, pick, env);
  return null;
}
function closeElection(S, pick, env){
  const sub = S.sub, fp = S.seats[sub.src];
  fp.hand.push(...pick);
  S.deck = shuffle(S.deck.concat(sub.cards.filter(id => !pick.includes(id))), env.rand);
  log(S, `The Foreign Power takes ${pick.length} cards from the top of the deck.`);
  S.sub = null; resumeTurn(S, env);
}
function drawN(S, seat, k, env){ for (let i = 0; i < k; i++) drawOne(S, seat, env); }

function startTurn(S, i, env){
  S.cur = i; S.mv = 3; S.sub = null; S.turnNo = (S.turnNo || 0) + 1;
  S.seats.forEach(s => { if (s.op === i) s.op = -1; });
  const s = S.seats[i];
  drawN(S, s, s.role === 'PM' ? 3 : s.role === 'F' ? 4 : 2, env);
  S.turnDl = env.now + TIME.turn; S.turnLeft = 0;
  S.botAt = env.now + BOT.move;
}
function endTurn(S, env){
  if (S.ph !== 'play') return;
  let j = S.cur;
  for (let k = 0; k < S.n; k++){ j = (j + 1) % S.n; if (!S.seats[j].out) break; }
  startTurn(S, j, env);
}
function pauseTurn(S, env){ if (S.turnDl){ S.turnLeft = Math.max(0, S.turnDl - env.now); S.turnDl = 0; } }
function resumeTurn(S, env){ if (!S.turnDl && S.ph === 'play'){ S.turnDl = env.now + Math.max(S.turnLeft, 15000); S.botAt = env.now + BOT.move; } }

function checkWin(S){
  if (S.ph !== 'play') return;
  const cnt = {G:0, O:0, F:0};
  S.seats.forEach(s => { cnt[sideOf(s.role)] += s.bills.length; });
  const pm = S.seats.find(s => s.role === 'PM');
  let w = null, why = '';
  if (pm.out){ w = 'O'; why = 'The Prime Minister has fallen.'; }
  else if (S.seats.filter(s => s.role === 'O').every(s => s.out)){ w = 'G'; why = 'The Opposition benches are empty.'; }
  else if (cnt.F >= NEED.F){ w = 'F'; why = 'The Foreign Power carried 3 bills through the Commons and has captured the state.'; }
  else if (cnt.G >= NEED.G){ w = 'G'; why = 'The Government carried 3 bills through the Commons.'; }
  else if (cnt.O >= NEED.O){ w = 'O'; why = 'The Opposition carried 2 private members’ bills through the Commons.'; }
  if (w){ S.ph = 'over'; S.win = w; S.whyWin = why; S.sub = null; S.turnDl = 0; log(S, why); }
}
function sideCounts(S){
  const cnt = {G:0, O:0, F:0};
  S.seats.forEach(s => { cnt[sideOf(s.role)] += s.bills.length; });
  return cnt;
}

function eliminate(S, i){
  const s = S.seats[i]; if (s.out) return;
  s.out = true;
  S.disc.push(...s.hand); s.bills.forEach(b => S.disc.push(...b.c));
  s.hand = []; s.bills = []; s.op = -1;
  log(S, `${s.nm} (${ROLE[s.role].name}) loses their seat.`);
}
function pickBill(seat, bi, bt){
  const B = seat.bills; if (!B.length) return -1;
  if (Number.isInteger(bi) && B[bi] && (!bt || B[bi].t === bt)) return bi;
  if (bt){ const j = B.findIndex(b => b.t === bt); if (j >= 0) return j; }
  return B.length - 1;
}

/* ---------- intents ---------- */
function handle(S, si, a, env){
  if (!a || typeof a !== 'object') return 'Unknown move.';
  if (S.ph !== 'play') return 'The game is over.';
  const me = S.seats[si];
  if (!me || me.out) return 'You have lost your seat.';
  if (S.brief){
    if (a.k !== 'ready') return 'The sitting begins once everyone has read the quick guide.';
    S.brief.ready[si] = 1;
    if (briefDone(S)) endBrief(S, env);
    return null;
  }
  if (a.k === 'ready') return null;
  if (a.k === 'pause') return pauseGame(S, si, env);
  if (a.k === 'resume') return resumeGame(S, si, env);
  if (S.pause) return 'The game is paused.';
  switch (a.k){
    case 'play': return playCard(S, si, a, env);
    case 'pass': return passBill(S, si, a, env);
    case 'trade': return offerTrade(S, si, a, env);
    case 'end':
      if (S.cur !== si) return 'It is not your turn.';
      if (S.sub) return 'Finish the current action first.';
      endTurn(S, env); return null;
    case 'resp': return respond(S, si, a, env);
    case 'rpass': {
      const sub = S.sub;
      if (sub && sub.k === 'resp' && a.at === sub.ver) sub.passed[si] = 1;
      return null;
    }
    case 'tans': return answerTrade(S, si, a, env);
    case 'talks': return finishTalks(S, si, a, env);
    case 'give': return giveFund(S, si, a, env);
    case 'elec': return finishElection(S, si, a, env);
  }
  return 'Unknown move.';
}

function turnGuard(S, si){
  if (S.cur !== si) return 'It is not your turn.';
  if (S.sub) return 'Wait for the current action to finish.';
  if (S.mv <= 0) return 'You have used all 3 moves. End your turn.';
  return null;
}

function playCard(S, si, a, env){
  const g = turnGuard(S, si); if (g) return g;
  const me = S.seats[si], ci = me.hand.indexOf(a.card);
  if (ci < 0) return 'You no longer hold that card.';
  const c = catalog(S.n)[a.card];
  if (c.t !== 'a' || ACTS[c.k].kind !== 'm') return 'That card is only played in response to another card.';
  const d = ACTS[c.k];
  let tg = Array.isArray(a.tg) ? a.tg.map(Number) : [];
  const ok = t => Number.isInteger(t) && t >= 0 && t < S.n && t !== si && !S.seats[t].out;
  if (d.tgt === 'none') tg = c.k === 'fund' ? S.seats.map((x, i) => i).filter(i => i !== si && !S.seats[i].out) : [];
  if (d.tgt === 'one' && !(tg.length === 1 && ok(tg[0]))) return 'Choose another player.';
  if (d.tgt === 'two' && !(tg.length === 2 && tg[0] !== tg[1] && tg.every(ok))) return 'Choose two other players.';
  if (d.tgt === 'bill'){
    if (!(tg.length === 1 && ok(tg[0]))) return 'Choose another player.';
    if (!S.seats[tg[0]].bills.length) return 'That player has no passed bills.';
  }
  if (d.tgt === 'vonc'){
    if (!S.fb) return 'No bill has passed yet, so no Vote of No Confidence can be called.';
    if (!(tg.length === 1 && ok(tg[0]))) return 'Choose another player.';
  }
  let bi = -1, bt = null;
  if (d.tgt === 'bill' || d.tgt === 'vonc'){
    bi = pickBill(S.seats[tg[0]], a.bi, null);
    bt = bi >= 0 ? S.seats[tg[0]].bills[bi].t : null;
  }
  me.hand.splice(ci, 1); S.disc.push(a.card); S.mv--;
  let msg = `${me.nm} plays ${d.name}`;
  if (tg.length && c.k !== 'fund') msg += ` on ${tg.map(t => nm(S, t)).join(' and ')}`;
  if (bt) msg += `’s ${BILL[bt].name}`;
  log(S, msg + '.');
  if (c.k === 'larry'){ applyBase(S, {a:'larry', src:si, tg:[]}, env, []); return null; }
  openResp(S, {a:c.k, src:si, tg, bi, bt}, env);
  return null;
}

function newResp(base, env){
  return {k:'resp', base, chain:[], mt:base.tg.length > 1, sh:{}, ver:0, lastS:base.src, last:null,
    pop:env.now, dl:env.now + TIME.pop + TIME.resp, passed:{}, bt:{}};
}
function openResp(S, base, env){
  pauseTurn(S, env);
  S.sub = newResp(base, env);
}

function respond(S, si, a, env){
  const sub = S.sub;
  if (!sub || sub.k !== 'resp') return 'There is nothing to respond to.';
  if (a.at !== sub.ver) return 'Too late: someone answered first.';
  const me = S.seats[si], ci = me.hand.indexOf(a.card);
  if (ci < 0) return 'You no longer hold that card.';
  const c = catalog(S.n)[a.card];
  if (c.t !== 'a') return 'That card cannot answer this.';
  let msg, forT = -1;
  if (c.k === 'jr'){
    if (!jrAllowed(sub, si)) return 'Judicial Review is only for a player the card is aimed at.';
    const guess = a.guess === 'a' ? 'a' : 'b';
    const r = jrReveal(S, guess, env);
    me.hand.splice(ci, 1); S.disc.push(a.card);
    const shown = r.k ? typeName(r.k) : 'nothing';
    const gtxt = guess === 'b' ? 'a bill card' : 'an action card';
    msg = `${me.nm} seeks Judicial Review and predicts ${gtxt}. The top card is ${shown}: the claim ${r.ok ? 'succeeds' : 'fails'}.`;
    if (r.ok){
      if (sub.mt) (sub.sh[si] || (sub.sh[si] = [])).push(['jr', si]);
      else sub.chain.push({a:'jr', s:si});
    }
    sub.ver++; sub.lastS = si; sub.last = ['jr', si, si, r.ok ? 1 : 0, r.k, guess];
    sub.pop = env.now; sub.dl = env.now + TIME.pop + TIME.resp; sub.passed = {}; sub.bt = {};
    log(S, msg);
    return null;
  }
  if (sub.mt){
    forT = Number(a.for);
    if (c.k !== 'sov') return 'Only Parliamentary Sovereignty can answer this.';
    if (!sub.base.tg.includes(forT) || S.seats[forT].out) return 'Choose a targeted player to shield.';
    const ch = sub.sh[forT] || (sub.sh[forT] = []);
    const topS = ch.length ? ch[ch.length - 1][1] : sub.base.src;
    if (topS === si) return 'You cannot answer your own card.';
    ch.push([c.k, si]);
    msg = ch.length % 2 ? `${me.nm} shields ${forT === si ? 'themselves' : nm(S, forT)} with Parliamentary Sovereignty.` : `${me.nm} cancels the shield on ${nm(S, forT)} with Parliamentary Sovereignty.`;
  } else {
    const top = sub.chain.length ? sub.chain[sub.chain.length - 1] : {a:sub.base.a, s:sub.base.src};
    if (top.s === si) return 'You cannot answer your own card.';
    if (!canCounter(c.k, top.a)) return 'That card cannot answer this.';
    sub.chain.push({a:c.k, s:si});
    msg = `${me.nm} answers with ${ACTS[c.k].name}.`;
  }
  me.hand.splice(ci, 1); S.disc.push(a.card);
  sub.ver++; sub.lastS = si; sub.last = [c.k, si, forT];
  sub.pop = env.now; sub.dl = env.now + TIME.pop + TIME.resp; sub.passed = {}; sub.bt = {};
  log(S, msg);
  if (c.k === 'pror' && me.hand.length){
    S.disc.push(...me.hand); me.hand = [];
    log(S, `${me.nm} discards their whole hand for the prorogation.`);
  }
  return null;
}

function respReady(S){
  const sub = S.sub;
  const top = sub.lastS;
  return S.seats.every((s, i) => s.out || i === top || sub.passed[i]);
}

function resolveResp(S, env){
  const sub = S.sub, ch = sub.chain, b = sub.base;
  if (sub.mt){
    const skip = b.tg.filter(t => (sub.sh[t] || []).length % 2 === 1);
    S.sub = null;
    if (skip.length) log(S, `${skip.map(t => nm(S, t)).join(' and ')} ${skip.length === 1 ? 'is' : 'are'} shielded.`);
    applyBase(S, b, env, skip);
    checkWin(S);
    if (!S.sub) resumeTurn(S, env);
    return;
  }
  let baseOn = true, first = null;
  if (ch.length){
    const act = new Array(ch.length);
    act[ch.length - 1] = true;
    for (let i = ch.length - 2; i >= 0; i--) act[i] = !act[i + 1];
    baseOn = !act[0]; first = ch[0];
  }
  S.sub = null;
  if (baseOn) applyBase(S, b, env, []);
  else {
    log(S, `${ACTS[b.a].name} is blocked.`);
    if (first.a === 'ri'){
      const orig = S.seats[b.src];
      if (!orig.out && orig.bills.length){
        const bi = orig.bills.length - 1;
        log(S, `Royal Intervention turns the Lords’ Rejection on ${orig.nm}’s ${BILL[orig.bills[bi].t].name}.`);
        S.sub = newResp({a:'lr', src:first.s, tg:[b.src], bi, bt:orig.bills[bi].t, defl:1}, env);
      } else log(S, `${orig.nm} has no bills before the Lords, so the deflected rejection fizzles.`);
    }
  }
  checkWin(S);
  if (!S.sub) resumeTurn(S, env);
}

function applyBase(S, b, env, skip){
  const src = S.seats[b.src];
  const t0 = b.tg.length ? S.seats[b.tg[0]] : null;
  switch (b.a){
    case 'larry': drawN(S, src, 2, env); log(S, `${src.nm} draws 2 cards.`); break;
    case 'coal': {
      let got = 0;
      b.tg.forEach(i => { const t = S.seats[i]; if (!skip.includes(i) && !t.out && t.hand.length){ const k = Math.floor(env.rand() * t.hand.length); src.hand.push(t.hand.splice(k, 1)[0]); got++; } });
      log(S, `${src.nm} takes ${got} random card${got === 1 ? '' : 's'}.`); break;
    }
    case 'talks': {
      const n = Math.min(2, src.hand.length, t0.hand.length);
      if (!n){ log(S, 'The talks collapse: someone has no cards to swap.'); break; }
      S.sub = {k:'talks', src:b.src, tgt:b.tg[0], n, dl:env.now + TIME.talks, at0:env.now};
      break;
    }
    case 'lr': case 'vonc': {
      if (t0.out) break;
      if (t0.bills.length){
        const j = pickBill(t0, b.bi, b.bt);
        const gone = t0.bills.splice(j, 1)[0];
        S.disc.push(...gone.c);
        log(S, b.a === 'lr' ? `The Lords reject ${t0.nm}’s ${BILL[gone.t].name}.` : `${t0.nm}’s ${BILL[gone.t].name} falls.`);
      } else if (b.a === 'vonc') eliminate(S, b.tg[0]);
      break;
    }
    case 'fund': {
      const wait = S.seats.map((s, i) => i).filter(i => i !== b.src && !skip.includes(i) && !S.seats[i].out && S.seats[i].hand.length);
      if (!wait.length){ log(S, 'Nobody gives anything.'); break; }
      S.sub = {k:'fund', src:b.src, wait, dl:env.now + TIME.fund, at0:env.now};
      break;
    }
    case 'inq': if (!t0.out){ t0.op = b.src; log(S, `${t0.nm} must play with their hand open.`); } break;
    case 'cs': {
      if (t0.out || !t0.bills.length) break;
      const j = pickBill(t0, b.bi, b.bt);
      const bill = t0.bills.splice(j, 1)[0];
      src.bills.push(bill);
      log(S, `${src.nm} takes ${t0.nm}’s ${BILL[bill.t].name}.`);
      break;
    }
  }
}

function passBill(S, si, a, env){
  const g = turnGuard(S, si); if (g) return g;
  const bd = BILL[a.b]; if (!bd) return 'Unknown bill.';
  const me = S.seats[si], cat = catalog(S.n);
  const ids = me.hand.filter(id => cat[id].t === 'b' && cat[id].k === a.b);
  const wilds = me.hand.filter(id => cat[id].t === 'w');
  if (!ids.length) return `A set needs at least one real ${bd.name} card.`;
  const real = ids.slice(0, bd.set), need = bd.set - real.length;
  if (wilds.length < need) return `You need ${bd.set} cards for the ${bd.name}, counting Henry VIII Clauses.`;
  const take = real.concat(wilds.slice(0, need));
  me.hand = me.hand.filter(id => !take.includes(id));
  me.bills.push({t:a.b, c:take}); S.mv--; S.fb = true;
  log(S, `The Commons passes ${me.nm}’s ${bd.name}${need ? ` with ${need} Henry VIII Clause${need === 1 ? '' : 's'}` : ''}.`);
  checkWin(S);
  return null;
}

function offerTrade(S, si, a, env){
  const g = turnGuard(S, si); if (g) return g;
  const tg = Number(a.tg);
  if (!(tg === -1 || (Number.isInteger(tg) && tg >= 0 && tg < S.n && tg !== si && !S.seats[tg].out))) return 'Choose who to trade with.';
  const me = S.seats[si];
  const give = [...new Set(Array.isArray(a.give) ? a.give : [])].filter(id => me.hand.includes(id));
  const want = {};
  Object.entries(a.want || {}).forEach(([k, v]) => { v = Math.floor(Number(v)); if ((BILL[k] || ACTS[k] || k === 'wild') && v > 0) want[k] = Math.min(v, 10); });
  if (!give.length && !Object.keys(want).length) return 'Offer at least one card or ask for one.';
  pauseTurn(S, env);
  S.sub = {k:'trade', src:si, tgt:tg, give, want, dl:env.now + TIME.trade, at0:env.now, dec:[]};
  log(S, tg === -1 ? `${me.nm} offers a trade to the whole House.` : `${me.nm} offers ${nm(S, tg)} a trade.`);
  return null;
}
function holdsWant(S, seat, want){
  const cat = catalog(S.n), picked = [];
  for (const [k, v] of Object.entries(want)){
    const ids = seat.hand.filter(id => cat[id].k === k && !picked.includes(id));
    if (ids.length < v) return null;
    picked.push(...ids.slice(0, v));
  }
  return picked;
}
function answerTrade(S, si, a, env){
  const sub = S.sub;
  const open = sub && sub.k === 'trade' && sub.tgt === -1;
  if (!sub || sub.k !== 'trade' || (open ? (si === sub.src || sub.dec.includes(si)) : sub.tgt !== si)) return 'There is no trade waiting for you.';
  const src = S.seats[sub.src], tgt = S.seats[si];
  if (open && !a.yes){
    sub.dec.push(si);
    const left = S.seats.some((s, i) => i !== sub.src && !s.out && !sub.dec.includes(i));
    if (!left){ log(S, 'Nobody takes up the trade.'); S.sub = null; resumeTurn(S, env); }
    return null;
  }
  if (a.yes){
    const picked = holdsWant(S, tgt, sub.want);
    if (!picked) return 'You do not hold the cards asked for.';
    const give = sub.give.filter(id => src.hand.includes(id));
    src.hand = src.hand.filter(id => !give.includes(id)); tgt.hand.push(...give);
    tgt.hand = tgt.hand.filter(id => !picked.includes(id)); src.hand.push(...picked);
    S.mv--;
    log(S, `${tgt.nm} accepts the trade.`);
  } else log(S, `${tgt.nm} turns the trade down.`);
  S.sub = null; resumeTurn(S, env);
  return null;
}
function finishTalks(S, si, a, env){
  const sub = S.sub;
  if (!sub || sub.k !== 'talks' || sub.src !== si) return 'There are no talks to finish.';
  const src = S.seats[sub.src], tgt = S.seats[sub.tgt];
  const mine = [...new Set(a.mine || [])].filter(id => src.hand.includes(id));
  const theirs = [...new Set(a.theirs || [])].filter(id => tgt.hand.includes(id));
  if (mine.length !== theirs.length || mine.length > sub.n) return `Pick the same number of cards on each side, up to ${sub.n}.`;
  swapCards(S, src, tgt, mine, theirs);
  S.sub = null; resumeTurn(S, env);
  return null;
}
function swapCards(S, src, tgt, mine, theirs){
  src.hand = src.hand.filter(id => !mine.includes(id)); tgt.hand.push(...mine);
  tgt.hand = tgt.hand.filter(id => !theirs.includes(id)); src.hand.push(...theirs);
  log(S, mine.length ? `${src.nm} and ${tgt.nm} swap ${mine.length} card${mine.length === 1 ? '' : 's'}.` : `${src.nm} leaves the talks without a deal.`);
}
function giveFund(S, si, a, env){
  const sub = S.sub;
  if (!sub || sub.k !== 'fund' || !sub.wait.includes(si)) return 'Nothing to give right now.';
  const me = S.seats[si], ci = me.hand.indexOf(a.card);
  if (ci < 0) return 'You no longer hold that card.';
  me.hand.splice(ci, 1); S.seats[sub.src].hand.push(a.card);
  sub.wait = sub.wait.filter(i => i !== si);
  if (!sub.wait.length){ log(S, `${nm(S, sub.src)} collects the donations.`); S.sub = null; resumeTurn(S, env); }
  return null;
}

/* ---------- bots ---------- */
const LEVELS = ['First-Time Voter', 'Rising Politician', 'Elderly Statesman'];
const LEVEL_TAG = ['Easy', 'Medium', 'Hard'];
function lv(S, si){ return S.lvlOf && si != null && S.lvlOf[si] != null ? S.lvlOf[si] : (S.lvl == null ? 1 : S.lvl); }
function cardValue(S, seat, id){
  const c = catalog(S.n)[id];
  if (c.t === 'w') return 7;
  if (c.t === 'b'){
    const have = seat.hand.filter(x => catalog(S.n)[x].k === c.k).length;
    return 2 + have / BILL[c.k].set * 6;
  }
  return {sov:5, cs:5, lr:4, vonc:4, ri:4, jr:3.5, diss:3.5, pa:3.5, coal:3, talks:3, fund:3, larry:2.5, pror:2, inq:1}[c.k] || 1;
}
function enemies(S, si){ const s = sideOf(S.seats[si].role); return S.seats.map((x, i) => i).filter(i => i !== si && !S.seats[i].out && sideOf(S.seats[i].role) !== s); }
function allies(S, si){ const s = sideOf(S.seats[si].role); return S.seats.map((x, i) => i).filter(i => !S.seats[i].out && sideOf(S.seats[i].role) === s); }
function holding(S, seat, k){ return seat.hand.find(id => catalog(S.n)[id].k === k); }
function countK(S, seat, k){ return seat.hand.filter(id => catalog(S.n)[id].k === k).length; }
/* Elderly Statesman: enemy seats ordered so the side closest to winning comes first */
function threatOrder(S, list){
  const cnt = sideCounts(S);
  const prog = i => { const sd = sideOf(S.seats[i].role); return cnt[sd] / NEED[sd]; };
  return list.slice().sort((x, y) => prog(y) - prog(x) || S.seats[y].bills.length - S.seats[x].bills.length || S.seats[y].hand.length - S.seats[x].hand.length);
}
/* Judicial Review prediction: random (easy), always "bill" (medium), from cards already seen (hard) */
function jrGuess(S, si, env){
  const L = lv(S, si);
  if (L === 0) return env.rand() < 0.5 ? 'b' : 'a';
  if (L === 1) return 'b';
  const cat = catalog(S.n), seen = new Set(S.seats[si].hand.concat(S.disc));
  S.seats.forEach((s, i) => { s.bills.forEach(b => b.c.forEach(id => seen.add(id))); if (s.op >= 0 && i !== si) s.hand.forEach(id => seen.add(id)); });
  let bills = 0, acts = 0;
  cat.forEach((c, id) => { if (seen.has(id)) return; if (c.t === 'b') bills++; else if (c.t === 'a') acts++; });
  return bills >= acts ? 'b' : 'a';
}

function botTurnMove(S, si, env){
  const me = S.seats[si], cat = catalog(S.n), L = lv(S, si), side = sideOf(me.role);
  if (S.mv <= 0) return {k:'end'};
  if (L === 0 && env.rand() < 0.3) return {k:'end'};
  const wilds = me.hand.filter(id => cat[id].t === 'w').length;
  for (const b of BILLS){
    const real = me.hand.filter(id => cat[id].k === b.k).length;
    if (real >= 1 && real + wilds >= b.set) return {k:'pass', b:b.k};
  }
  const en = enemies(S, si);
  let withBills = en.filter(i => S.seats[i].bills.length);
  let rich = en.slice();
  if (L === 0){ shuffle(withBills, env.rand); shuffle(rich, env.rand); }
  else if (L === 1){ withBills.sort((x, y) => S.seats[y].bills.length - S.seats[x].bills.length); rich.sort((x, y) => S.seats[y].hand.length - S.seats[x].hand.length); }
  else { withBills = threatOrder(S, withBills); rich = threatOrder(S, rich); }
  let id;
  if (withBills.length && (id = holding(S, me, 'cs'))){
    const t = withBills[0], B = S.seats[t].bills;
    let bi = 0; if (L > 0) B.forEach((b, j) => { if (BILL[b.t].set > BILL[B[bi].t].set) bi = j; });
    return {k:'play', card:id, tg:[t], bi};
  }
  if (withBills.length && (id = holding(S, me, 'lr'))){
    const t = withBills[0], B = S.seats[t].bills;
    let bi = 0; if (L === 2) B.forEach((b, j) => { if (BILL[b.t].set > BILL[B[bi].t].set) bi = j; });
    return {k:'play', card:id, tg:[t], bi};
  }
  if (S.fb && (id = holding(S, me, 'vonc'))){
    if (withBills.length) return {k:'play', card:id, tg:[withBills[0]], bi:0};
    let bare = en.filter(i => !S.seats[i].bills.length);
    if (L === 2){
      /* the Foreign Power gains nothing from the PM falling (the Opposition would win) */
      if (side === 'F') bare = bare.filter(i => S.seats[i].role !== 'PM');
      if (side === 'G') bare.sort((x, y) => (S.seats[y].role === 'O') - (S.seats[x].role === 'O'));
    }
    const pm = bare.find(i => S.seats[i].role === 'PM');
    const t = L === 0 ? bare[Math.floor(env.rand() * bare.length)] : (pm !== undefined && !(L === 2 && side === 'G') ? pm : bare[0]);
    if (t !== undefined && env.rand() < 0.85) return {k:'play', card:id, tg:[t]};
  }
  /* Elderly Statesman: ask a teammate for the one card that completes a set (once a turn) */
  if (L === 2 && S.tradeTry !== S.turnNo){
    const mates = allies(S, si).filter(i => i !== si && S.seats[i].hand.length);
    const near = BILLS.find(b => { const r = countK(S, me, b.k); return r >= 1 && b.set - r - wilds === 1; });
    const spare = me.hand.filter(x => cat[x].t === 'a' || (cat[x].t === 'b' && (!near || cat[x].k !== near.k))).sort((x, y) => cardValue(S, me, x) - cardValue(S, me, y))[0];
    if (near && mates.length && spare !== undefined){
      S.tradeTry = S.turnNo;
      return {k:'trade', tg:mates[Math.floor(env.rand() * mates.length)], give:[spare], want:{[near.k]:1}};
    }
  }
  const others = S.seats.map((s, i) => i).filter(i => i !== si && !S.seats[i].out && S.seats[i].hand.length);
  if ((id = holding(S, me, 'coal')) && others.length >= 2){
    const pool = rich.filter(i => S.seats[i].hand.length).concat(others.filter(i => !rich.includes(i)));
    const two = [...new Set(pool)].slice(0, 2);
    if (two.length === 2) return {k:'play', card:id, tg:two};
  }
  if ((id = holding(S, me, 'talks')) && me.hand.length > 1 && rich.length && S.seats[rich[0]].hand.length > 1) return {k:'play', card:id, tg:[rich[0]]};
  if ((id = holding(S, me, 'fund'))) return {k:'play', card:id};
  if ((id = holding(S, me, 'larry'))) return {k:'play', card:id};
  if ((id = holding(S, me, 'inq')) && rich.length && env.rand() < [0.3, 0.3, 0][L]) return {k:'play', card:id, tg:[rich[0]]};
  return {k:'end'};
}

const ANSWER = [0.45, 0.85, 1], JR_USE = [0.4, 0.7, 0.9];
const BIG = ['lr', 'vonc', 'cs'];
function botRespondMT(S, si, env){
  const sub = S.sub, me = S.seats[si], b = sub.base, side = sideOf(me.role), L = lv(S, si);
  const jid = holding(S, me, 'jr');
  if (jid !== undefined && sideOf(S.seats[b.src].role) !== side && jrAllowed(sub, si) && env.rand() < JR_USE[L]) return {k:'resp', card:jid, at:sub.ver, guess:jrGuess(S, si, env)};
  const id = holding(S, me, 'sov'); if (id === undefined) return null;
  if (L === 2 && countK(S, me, 'sov') < 2) return null;
  const lastOf = t => { const ch = sub.sh[t] || []; return ch.length ? ch[ch.length - 1][1] : b.src; };
  if (sideOf(S.seats[b.src].role) === side){
    if (L === 0) return null;
    for (const t of b.tg){
      const ch = sub.sh[t] || [];
      if (ch.length % 2 === 1 && lastOf(t) !== si && sideOf(S.seats[t].role) !== side && env.rand() < (L === 2 ? 0.8 : 0.5)) return {k:'resp', card:id, at:sub.ver, for:t};
    }
    return null;
  }
  const order = L === 0 ? [si] : [si].concat(b.tg.filter(t => t !== si && sideOf(S.seats[t].role) === side));
  for (const t of order){
    if (!b.tg.includes(t) || S.seats[t].out) continue;
    const ch = sub.sh[t] || [];
    if (ch.length % 2 === 0 && lastOf(t) !== si && env.rand() < ANSWER[L]) return {k:'resp', card:id, at:sub.ver, for:t};
  }
  return null;
}
function botRespond(S, si, env){
  if (S.sub.mt) return botRespondMT(S, si, env);
  const sub = S.sub, me = S.seats[si], b = sub.base, L = lv(S, si);
  const top = sub.chain.length ? sub.chain[sub.chain.length - 1] : {a:b.a, s:b.src};
  if (top.s === si) return null;
  if (L === 0 && b.src !== si && !b.tg.includes(si)) return null;
  const mySide = sideOf(me.role);
  const srcAlly = sideOf(S.seats[b.src].role) === mySide;
  const hitsUs = b.tg.some(t => sideOf(S.seats[t].role) === mySide);
  let wantBase;
  if (b.src === si) wantBase = true;
  else if (srcAlly) wantBase = !hitsUs;
  else if (b.a === 'larry') wantBase = env.rand() < 0.8;
  else if (b.a === 'fund') wantBase = false;
  else wantBase = !hitsUs;
  const baseOnNow = sub.chain.length % 2 === 0;
  if (wantBase === baseOnNow) return null;
  const order = top.a === 'lr' ? ['ri', 'pa', 'jr', 'sov'] : top.a === 'vonc' ? ['diss', 'jr', 'sov', 'pror'] : ['jr', 'sov'];
  for (const k of order){
    const id = holding(S, me, k);
    if (id === undefined) continue;
    if (k === 'jr'){ if (jrAllowed(sub, si) && env.rand() < JR_USE[L]) return {k:'resp', card:id, at:sub.ver, guess:jrGuess(S, si, env)}; continue; }
    if (!canCounter(k, top.a)) continue;
    if (k === 'pror' && !(b.tg.includes(si) && top.a === 'vonc')) continue;
    /* Elderly Statesman keeps Parliamentary Sovereignty for bills and seats unless it holds two */
    if (k === 'sov' && L === 2 && !BIG.includes(b.a) && countK(S, me, 'sov') < 2) continue;
    if (env.rand() < ANSWER[L]) return {k:'resp', card:id, at:sub.ver};
    return null;
  }
  return null;
}

function botTrade(S, si, env){
  const sub = S.sub, me = S.seats[si], L = lv(S, si);
  const picked = holdsWant(S, me, sub.want);
  if (!picked) return {k:'tans', yes:false};
  if (sideOf(S.seats[sub.src].role) === sideOf(me.role)) return {k:'tans', yes:true};
  const gain = sub.give.reduce((t, id) => t + cardValue(S, me, id), 0);
  const loss = picked.reduce((t, id) => t + cardValue(S, me, id), 0);
  if (L === 0) return {k:'tans', yes:gain > loss - 1 || env.rand() < 0.3};
  return {k:'tans', yes:gain > loss + (L === 2 ? 2 : 1)};
}

/* ---------- clock ---------- */
/* ---------- pause and briefing ---------- */
function shiftClocks(S, d){
  if (S.turnDl) S.turnDl += d;
  if (S.botAt) S.botAt += d;
  const sub = S.sub;
  if (sub){
    ['dl', 'pop', 'at0'].forEach(k => { if (typeof sub[k] === 'number' && sub[k]) sub[k] += d; });
    if (sub.bt) Object.keys(sub.bt).forEach(k => { sub.bt[k] += d; });
  }
}
function briefDone(S){ return S.seats.every((s, i) => s.bot || s.out || S.brief.ready[i]); }
function endBrief(S, env){
  shiftClocks(S, Math.max(0, env.now - S.brief.t0));
  S.brief = null;
  log(S, 'Order! The sitting begins.');
}
function pauseGame(S, si, env){
  if (S.pause) return 'The game is already paused.';
  S.pause = {by:si, at:env.now, t0:env.now};
  log(S, `${S.seats[si].nm} pauses the game.`);
  return null;
}
function resumeGame(S, si, env){
  const p = S.pause;
  if (!p) return 'The game is not paused.';
  if (si !== p.by && env.now < p.at + PAUSE_LOCK) return `Only ${S.seats[p.by].nm} can resume for now. Everyone else can in ${Math.ceil((p.at + PAUSE_LOCK - env.now) / 1000)} seconds.`;
  shiftClocks(S, Math.max(0, env.now - p.t0));
  S.pause = null;
  log(S, `${S.seats[si].nm} resumes the game.`);
  return null;
}

function tick(S, env){
  if (S.ph !== 'play') return;
  if (S.brief){ if (env.now >= S.brief.until || briefDone(S)) endBrief(S, env); return; }
  if (S.pause) return;
  if (!S.sub && S.elecQ > 0){ openElection(S, env); return; }
  const now = env.now, sub = S.sub;
  if (sub && sub.k === 'elec'){
    const fp = S.seats[sub.src];
    if ((fp.bot && now >= sub.at0 + TIME.pop + BOT.answer) || now >= sub.dl){
      const best = (lv(S, sub.src) === 0 && fp.bot ? shuffle(sub.cards.slice(), env.rand) : sub.cards.slice().sort((x, y) => cardValue(S, fp, y) - cardValue(S, fp, x))).slice(0, sub.n);
      closeElection(S, best, env);
    }
    return;
  }
  if (sub && sub.k === 'resp'){
    const top = sub.lastS;
    for (let i = 0; i < S.n; i++){
      const s = S.seats[i];
      if (!s.bot || s.out || i === top || sub.passed[i]) continue;
      if (sub.bt[i] == null) sub.bt[i] = sub.pop + TIME.pop + BOT.react + env.rand() * BOT.reactJ;
      if (now >= sub.bt[i]){
        const r = botRespond(S, i, env);
        if (r){ handle(S, i, r, env); return; }
        sub.passed[i] = 1;
      }
    }
    if (now >= sub.dl || (now >= sub.pop + TIME.pop && respReady(S))) resolveResp(S, env);
    return;
  }
  if (sub && sub.k === 'trade'){
    if (sub.tgt === -1){
      if (!sub.bt) sub.bt = {};
      for (let i = 0; i < S.n; i++){
        const s = S.seats[i];
        if (!s.bot || s.out || i === sub.src || sub.dec.includes(i)) continue;
        if (sub.bt[i] == null) sub.bt[i] = sub.at0 + BOT.answer + env.rand() * 3000;
        if (now >= sub.bt[i]){ handle(S, i, botTrade(S, i, env), env); if (S.sub !== sub) return; }
      }
      if (now >= sub.dl){ log(S, 'Nobody takes up the trade.'); S.sub = null; resumeTurn(S, env); }
      return;
    }
    if (S.seats[sub.tgt].bot && now >= sub.at0 + BOT.answer){ handle(S, sub.tgt, botTrade(S, sub.tgt, env), env); return; }
    if (now >= sub.dl){ log(S, `${nm(S, sub.tgt)} did not answer the trade.`); S.sub = null; resumeTurn(S, env); }
    return;
  }
  if (sub && sub.k === 'talks'){
    const src = S.seats[sub.src], tgt = S.seats[sub.tgt];
    if (src.bot && now >= sub.at0 + BOT.answer || now >= sub.dl){
      let mine, theirs;
      if (src.bot && lv(S, sub.src) > 0){
        theirs = tgt.hand.slice().sort((x, y) => cardValue(S, src, y) - cardValue(S, src, x)).slice(0, sub.n);
        mine = src.hand.slice().sort((x, y) => cardValue(S, src, x) - cardValue(S, src, y)).slice(0, sub.n);
      } else {
        theirs = shuffle(tgt.hand.slice(), env.rand).slice(0, sub.n);
        mine = shuffle(src.hand.slice(), env.rand).slice(0, sub.n);
      }
      swapCards(S, src, tgt, mine, theirs); S.sub = null; resumeTurn(S, env);
    }
    return;
  }
  if (sub && sub.k === 'fund'){
    for (const i of sub.wait.slice()){
      const s = S.seats[i];
      if ((s.bot && now >= sub.at0 + BOT.answer) || now >= sub.dl){
        const pick = s.bot && lv(S, i) > 0 ? s.hand.slice().sort((x, y) => cardValue(S, s, x) - cardValue(S, s, y))[0] : s.hand[Math.floor(env.rand() * s.hand.length)];
        if (pick === undefined){ sub.wait = sub.wait.filter(j => j !== i); continue; }
        handle(S, i, {k:'give', card:pick}, env);
        if (!S.sub) return;
      }
    }
    if (S.sub && S.sub.k === 'fund' && !S.sub.wait.length){ S.sub = null; resumeTurn(S, env); }
    return;
  }
  const cur = S.seats[S.cur];
  if (cur.bot){
    if (now >= S.botAt){
      const m = botTurnMove(S, S.cur, env);
      const err = handle(S, S.cur, m, env);
      if (err && m.k !== 'end') handle(S, S.cur, {k:'end'}, env);
      S.botAt = now + BOT.move - BOT.jitter + env.rand() * 2 * BOT.jitter;
    }
    return;
  }
  if (S.turnDl && now >= S.turnDl){ log(S, `${cur.nm}’s time is up.`); endTurn(S, env); }
}

/* ---------- public view sent to every phone ---------- */
function subPub(sub){
  if (!sub) return null;

  if (sub.k === 'trade') return {k:'trade', src:sub.src, tgt:sub.tgt, give:sub.give, want:sub.want, dl:sub.dl, dec:sub.dec};
  if (sub.k === 'talks') return {k:'talks', src:sub.src, tgt:sub.tgt, n:sub.n, dl:sub.dl};
  if (sub.k === 'fund') return {k:'fund', src:sub.src, wait:sub.wait, dl:sub.dl};
  if (sub.k === 'elec') return {k:'elec', src:sub.src, cards:sub.cards, n:sub.n, dl:sub.dl, pop:sub.at0};
  return null;
}
function pubState(S){
  return {c:S.code, n:S.n, ph:S.ph, cur:S.cur, mv:S.mv, fb:S.fb ? 1 : 0, dk:S.deck.length, dc:S.disc.length, win:S.win, why:S.whyWin || '',
    s:S.seats.map(s => ({nm:s.nm, c:s.cid, b:s.bot ? 1 : 0, r:s.role, h:s.hand, bl:s.bills.map(b => b.t).join(''), o:s.out ? 1 : 0, op:s.op})),
    pz:S.pause ? {by:S.pause.by, at:S.pause.at} : null, br:S.brief ? {until:S.brief.until, rd:Object.keys(S.brief.ready).map(Number)} : null, lv:lv(S), sub:subPub(S.sub), tdl:S.turnDl, tl:S.turnLeft, log:S.log, ak:S.ak, er:S.er};
}

if (typeof module !== 'undefined') module.exports = {BILLS, ACTS, catalog, newGame, handle, tick, pubState, sideCounts, botTurnMove, LEVELS};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- networking: Firebase Realtime Database ----------
   One device (the host) runs the rules. Paths per sitting:
   games/CODE/state       host writes the public game state (as JSON text)
   games/CODE/online/CID  each open device, removed automatically on disconnect
   games/CODE/intents/CID each player's latest move (as JSON text)            */
const FB_CFG = typeof firebaseConfig === 'object' ? firebaseConfig : null;
const FB_ON = !!(FB_CFG && FB_CFG.apiKey && !/PASTE/.test(FB_CFG.apiKey));
let fb = null, fbTried = false, fbErr = '', subs = [], hostCid = null;

async function ensureRoom(){
  if (fbTried) return fb;
  fbTried = true;
  if (!FB_ON){ fbErr = 'not-configured'; return null; }
  if (!window.firebase){ fbErr = 'library'; return null; }
  try {
    firebase.initializeApp(FB_CFG);
    await firebase.auth().signInAnonymously();
    fb = firebase.database();
  } catch (e){ fbErr = (e && (e.code || e.message)) || 'unknown'; fb = null; }
  return fb;
}
const gref = p => fb.ref('games/' + code + (p ? '/' + p : ''));
function listen(ref, ev, fn){ ref.on(ev, fn, err => toast('Lost connection to the game server: ' + (err && err.code || 'error'))); subs.push(() => ref.off(ev, fn)); }
function unlistenAll(){ subs.forEach(f => { try { f(); } catch (e) {} }); subs = []; }
function goOnline(){
  const r = gref('online/' + me.cid);
  r.onDisconnect().remove();
  return r.set({nm:me.nm, t:firebase.database.ServerValue.TIMESTAMP});
}
function noServer(){
  toast(fbErr === 'not-configured' ? 'This copy is not connected to Firebase yet. Practice mode still works.'
    : fbErr === 'auth/operation-not-allowed' ? 'Turn on Anonymous sign-in in Firebase Authentication.'
    : 'Could not reach the game server (' + fbErr + '). Practice mode still works.');
}

let writing = false, queued = null;
function pushState(hs){
  queued = JSON.stringify(hs);
  if (writing) return;
  writing = true;
  const j = queued; queued = null;
  gref('state').set({j}).catch(() => toast('Could not save the game. Check your connection.')).finally(() => {
    writing = false;
    if (queued){ const next = JSON.parse(queued); pushState(next); }
  });
}

function publish(){
  if (!S && !lobby) return;
  const hs = S ? pubState(S) : {c:code, ph:'lobby', pl:lobby.players, n:lobby.n, lv:lobby.lvl == null ? 1 : lobby.lvl};
  hs.hc = me.cid;
  if (S) hs.on = S.seats.map(s => (s.bot || s.cid === me.cid || online.has(s.cid)) ? 1 : 0);
  const key = JSON.stringify(hs);
  if (key === lastKey) return;
  lastKey = key; hs.ts = Date.now();
  P = hs; pRecv = hs.ts;
  if (fb && mode === 'host') pushState(hs);
  if (mode === 'host') LS.set('oo-host', {code, S, lobby});
  render();
}

function hostOnline(snap){
  const v = snap.val() || {};
  online = new Set(Object.keys(v).filter(c => c !== me.cid));
  if (!S && lobby){
    const others = Object.entries(v).filter(([c]) => c !== me.cid).sort((a, b) => (a[1].t || 0) - (b[1].t || 0));
    lobby.players = [{cid:me.cid, nm:me.nm}].concat(others.map(([c, x]) => ({cid:c, nm:cleanName(x && x.nm) || 'Member'}))).slice(0, 8);
  }
  publish();
}
function hostIntent(snap){
  if (!S) return;
  const cid = snap.key, v = snap.val();
  let a; try { a = JSON.parse(v && v.j); } catch (e) { return; }
  const si = S.seats.findIndex(s => s.cid === cid);
  if (si < 0 || !a || typeof a.q !== 'number' || a.q <= (S.ak[cid] || 0)) return;
  const err = handle(S, si, a, envNow());
  S.ak[cid] = a.q;
  if (err) S.er[cid] = {q:a.q, m:err};
  publish();
}
function hostAttach(){
  listen(gref('online'), 'value', hostOnline);
  listen(gref('intents'), 'child_added', hostIntent);
  listen(gref('intents'), 'child_changed', hostIntent);
}

function startTicking(){

    publish();

}

async function hostNew(){
  if (!requireName()) return;
  const db = await ensureRoom();
  if (!db){ noServer(); return; }
  for (let i = 0; i < 5; i++){
    code = rid(4).toUpperCase();
    const ex = await gref('state').get().catch(() => null);
    if (!ex || !ex.exists()) break;
  }
  mode = 'host'; S = null; lobby = {players:[{cid:me.cid, nm:me.nm}], n:6, lvl:1};
  await gref('intents').remove().catch(() => {});
  await goOnline().catch(() => {});
  hostAttach();
  ui.screen = 'lobby'; lastKey = '';
  startTicking(); publish();
}

async function hostResume(){
  const saved = LS.get('oo-host'); if (!saved) return;
  const db = await ensureRoom();
  if (!db){ noServer(); return; }
  code = saved.code; mode = 'host'; S = saved.S; lobby = saved.lobby;
  if (S && S.ph === 'play'){
    const now = Date.now();
    if (S.turnDl) S.turnDl = now + 30000;
    if (S.sub && S.sub.dl) S.sub.dl = now + 8000;
    S.botAt = now + 1500;
    if (S.pause) S.pause.t0 = now;
    if (S.brief){ S.brief.t0 = now; S.brief.until = Math.max(S.brief.until, now + 20000); }
  }
  await goOnline().catch(() => {});
  hostAttach();
  ui.screen = S ? 'game' : 'lobby'; lastKey = '';
  startTicking(); publish();
}

function guestState(snap){

const local = t => pRecv + (t - (P.ts || pRecv));
function mySeat(){ return P && P.s ? P.s.findIndex(s => s.c === me.cid) : -1; }
function cat(){ return catalog(P.n); }
function typeOfId(id){ return cat()[id].k; }
function myHand(){ const i = mySeat(); return i >= 0 ? P.s[i].h : []; }
function countType(hand, k){ return hand.filter(id => typeOfId(id) === k).length; }
function topOf(sub){ return sub.ch.length ? {a:sub.ch[sub.ch.length - 1][0], s:sub.ch[sub.ch.length - 1][1]} : {a:sub.base.a, s:sub.base.src}; }

function wildsIn(hand){ return countType(hand, 'wild'); }
function canPassWith(hand, k){ const r = countType(hand, k); return r >= 1 && r + wildsIn(hand) >= BILL[k].set; }
function billTotals(){ const c = {G:0, O:0, F:0}; P.s.forEach(s => { c[ROLE[s.r].side] += s.bl.length; }); return c; }

const BRIEF = {larry:'Draw 2 cards', lr:'Knock out a bill', coal:'Take 2 random cards', talks:'See a hand, swap 2', vonc:'Knock out a bill or a seat',
  fund:'Everyone gives you a card', inq:'Open a player’s hand', cs:'Take a passed bill', pa:'Cancel a Lords’ Rejection', ri:'Cancel it, turn it back',
  jr:'Predict bill or action', diss:'Block a no-confidence vote', pror:'Block the vote, lose your hand', sov:'Shield or cancel'};
function art(k){ return `<span class="c-art" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#i-${k}"/></svg></span>`; }
function cardFace(id, opts = {}){
  const c = cat()[id], hand = myHand();
  const sel = opts.sel ? ' is-sel' : '';
  const act = opts.act || 'card';
  if (c.t === 'w'){
    return `<button type="button" class="card wild${sel}" data-act="${act}" data-id="${id}">

  }
  if (c.t === 'b'){
    const b = BILL[c.k], have = countType(hand, c.k), w = wildsIn(hand);

    const foot = opts.plain ? `Set of ${b.set}` : (w && have < b.set ? `${have}/${b.set} + ${Math.min(w, b.set - have)} wild` : `${have} of ${b.set} held`);

function chip(k){

  if (BILL[k]) return `<span class="chip" style="--band:${BILL[k].col}">${ico(k)}${esc(BILL[k].short)}</span>`;

}

function lvlPicker(sel, act){

const EMB = {G:'gov', O:'opp', F:'fp'};
function guideBody(start){

      <div class="g-step"><span class="g-end">End</span><b>Next player</b></div>
    </div>
    <p>Start by drawing from the deck: the Prime Minister draws 3, the Foreign Power 4, everyone else 2. You have 2 minutes.</p></section>
  <section class="g-sec"><h3>A move is one of</h3>

function gameView(){
  if (!P || !P.s){
    const lost = hostLostAt && Date.now() > hostLostAt;
