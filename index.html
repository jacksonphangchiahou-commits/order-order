const ROLETAG = {PM:'PM', G:'GOV', O:'OPP', F:'FP'};
function seatView(s, i, my){
  const cls = ['seat', 'camp-' + ROLE[s.r].side];
  if (s.r === 'PM') cls.push('is-pm');
  if (i === P.cur && P.ph === 'play') cls.push('is-cur');
  if (s.o) cls.push('is-out');
  if (i === my) cls.push('is-me');
  const aim = ui.aim;
  if (aim && validAimSeat(aim, i)) cls.push('is-pick');
  if (aim && aim.picks.includes(i)) cls.push('is-picked');
  const off = P.on && !P.on[i];
  const flags = [i === my ? '<span class="flag me">YOU</span>' : '', s.b ? '<span class="flag">BOT</span>' : '',
    off ? '<span class="flag warn" title="Offline">OFF</span>' : '', s.op >= 0 ? '<span class="flag open" title="Hand open">OPEN</span>' : ''].join('');
  const bills = s.bl.split('').map(k => `<span class="t-bill" style="--band:${BILL[k].col}" title="${esc(BILL[k].name)}">${ico(k)}</span>`).join('');
  const label = `${s.nm}, ${ROLE[s.r].name}, ${s.o ? 'lost seat' : s.h.length + ' cards'}, ${s.bl.length} bills`;
  return `<div class="${cls.join(' ')}" data-act="seat" data-i="${i}" role="button" tabindex="0" aria-label="${esc(label)}">
    <div class="t-top"><span class="role r-${s.r}">${ROLETAG[s.r]}</span><span class="t-flags">${flags}</span></div>
    <div class="sname">${esc(s.nm)}</div>
    <div class="t-bot">${s.o ? '<span class="flag">OUT</span>' : `<span class="handct"><i class="cardglyph" aria-hidden="true"></i>${s.h.length}</span>`}<span class="t-bills">${bills}</span></div>
  </div>`;
}
function seatSheet(i){
  const s = P.s[i], my = mySeat();
  if (!s) return '';
  const off = P.on && !P.on[i];
  const bits = [ROLE[s.r].name, s.o ? 'lost their seat' : `${s.h.length} card${s.h.length === 1 ? '' : 's'} in hand`];
  if (s.b) bits.push('bot'); if (off) bits.push('offline'); if (i === P.cur && P.ph === 'play') bits.push('has the floor');
  const bills = s.bl.split('').map(k => `<li>${chip(k)} ${esc(BILL[k].name)}</li>`).join('');
  const open = s.op >= 0 && i !== my;
  return `<h2 class="camp-${ROLE[s.r].side} seat-title">${esc(s.nm)}${i === my ? ' <small>(you)</small>' : ''}</h2>
    <p class="muted">${bits.map(esc).join(' · ')}</p>
    <h3>Bills passed by the Commons</h3>
    ${bills ? `<ul class="rules plain">${bills}</ul>` : '<p class="muted">None yet.</p>'}
    ${s.op >= 0 ? `<h3>Hand open to the House</h3>${open ? (s.h.length ? `<div class="chips">${s.h.map(id => chip(typeOfId(id))).join('')}</div>` : '<p class="muted">No cards.</p>') : '<p class="muted">Your hand is open to everyone until the inquiry ends.</p>'}` : ''}`;
}

function bannerView(my){
  if (P.ph === 'over') return `<p class="banner">The sitting is over.</p>`;
  if (P.br){
    const humans = P.s.filter(s => !s.b).length, rd = (P.br.rd || []).length;
    return `<p class="banner">Waiting for everyone to finish the quick guide: <b>${rd} of ${humans}</b> ready. Starts in <span data-tdl="${local(P.br.until)}"></span>.</p>`;
  }
  if (ui.aim){
    const need = ui.aim.kind === 'two' ? `Choose two players (${ui.aim.picks.length} of 2)` : (ui.aim.kind === 'bill' ? 'Tap a player with a Commons-passed bill' : ui.aim.kind === 'vonc' ? 'Choose a player. With no bills, they are eliminated' : 'Choose a player');
    return `<p class="banner aim"><b>${esc(ACTS[ui.aim.k].name)}:</b> ${need}. <button type="button" class="linkish" data-act="cancelaim">Cancel</button></p>`;
  }
  const sub = P.sub;
  if (sub){
    if (sub.k === 'resp'){
      const b = sub.base;
      let line = `${esc(seatName(b.src))} plays <b>${esc(ACTS[b.a].name)}</b>`;
      if (b.tg && b.tg.length) line += ` on ${b.tg.map(t => esc(seatName(t))).join(' and ')}`;
      if (b.bt) line += `’s ${esc(BILL[b.bt].name)}`;
      if (b.a === 'fund') line = `${esc(seatName(b.src))} plays <b>${esc(ACTS[b.a].name)}</b> on everyone`;
      const chain = sub.mt ? '' : sub.ch.map(([a, s]) => `<li>${esc(seatName(s))}: ${esc(ACTS[a].name)}</li>`).join('');
      return `<div class="banner resp"><p>${line}.</p>${chain ? `<ol class="chain">${chain}</ol>` : ''}${shieldList(sub)}${timerBar(sub.dl, TIME.resp)}</div>`;
    }
    if (sub.k === 'trade') return `<div class="banner"><p>${esc(seatName(sub.src))} offers ${sub.tgt === -1 ? 'the whole House' : esc(seatName(sub.tgt))} a trade${sub.tgt === -1 ? '. First to accept takes it' : ''}.</p>${timerBar(sub.dl, TIME.trade)}</div>`;
    if (sub.k === 'talks') return `<div class="banner"><p>${esc(seatName(sub.src))} is in cross-party talks with ${esc(seatName(sub.tgt))}.</p>${timerBar(sub.dl, TIME.talks)}</div>`;
    if (sub.k === 'elec') return `<div class="banner aim"><p><b>Election Interference.</b> The Foreign Power is choosing ${sub.n} of the top ${sub.cards.length} cards of the deck.</p>${timerBar(sub.dl, TIME.pop + TIME.elec)}</div>`;
    if (sub.k === 'fund') return `<div class="banner"><p>Party Funding for ${esc(seatName(sub.src))}: waiting on ${sub.wait.length} donor${sub.wait.length === 1 ? '' : 's'}.</p>${timerBar(sub.dl, TIME.fund)}</div>`;
  }
  if (P.cur === my) return `<p class="banner mine">Your turn. <b>${P.mv}</b> move${P.mv === 1 ? '' : 's'} left.</p>`;
  return `<p class="banner">${esc(seatName(P.cur))} has the floor.</p>`;
}

function dockView(my, meS){
  const hand = meS.h.slice().sort((x, y) => {
    const a = cat()[x], b = cat()[y], r = {b:0, w:1, a:2};
    if (a.t !== b.t) return r[a.t] - r[b.t];
    return a.k < b.k ? -1 : a.k > b.k ? 1 : 0;
  });
  const side = ROLE[meS.r].side;
  const canAct = myTurnFree();
  const cards = hand.length ? hand.map(id => cardFace(id, {sel:ui.sel === id})).join('') : '<p class="muted empty">No cards in hand.</p>';
  return `<div class="dock">
    <div class="dock-head">
      <span class="role r-${meS.r}">${ROLE[meS.r].name}</span>
      <span class="goal">${meS.o ? 'You have lost your seat.' : side === 'F' ? 'Carry 3 bills through the Commons before the Government does.' : side === 'G' ? 'Government needs 3 bills through the Commons. Keep the PM in office.' : 'Opposition needs 2 bills through the Commons, or bring down the PM.'}</span>
    </div>
    <div class="hand-scroll" aria-label="Your hand">${cards}</div>
    <div class="dock-actions">
      <button type="button" class="btn ghost" data-act="tradeopen" ${canAct ? '' : 'disabled'}>Offer a trade</button>
      <button type="button" class="btn brass" data-act="end" ${P.cur === my && !P.sub && P.ph === 'play' ? '' : 'disabled'}>End turn</button>
    </div>
  </div>`;
}

function validAimSeat(aim, i){
  const s = P.s[i];
  if (!s || s.o || i === mySeat()) return false;
  if (aim.kind === 'bill') return s.bl.length > 0;
  return true;
}

function respKey(sub){ return `${sub.base.src}|${sub.base.a}|${sub.base.tg.join(',')}|${sub.ver}|${sub.dl}`; }
function myCounters(sub){
  const my = mySeat(); if (my < 0 || P.s[my].o) return [];
  if (sub.mt){
    const sov = P.s[my].h.find(id => typeOfId(id) === 'sov');
    const out = [];
    for (const t of (sov === undefined ? [] : sub.base.tg)){
      if (P.s[t].o) continue;
      const ch = (sub.sh && sub.sh[t]) || [];
      const lastS = ch.length ? ch[ch.length - 1][1] : sub.base.src;
      if (lastS === my) continue;
      const who = t === my ? 'yourself' : esc(seatName(t));
      const label = ch.length % 2 ? `Cancel the shield on ${who}` : (t === my ? 'Shield yourself' : `Shield ${who}`);
      out.push({id:sov, for:t, label, sub:ch.length % 2 ? 'Parliamentary Sovereignty removes their protection.' : 'Parliamentary Sovereignty protects this player from the card.'});
    }
    return out.concat(jrOptions(sub, my));
  }
  const top = topOf(sub); if (top.s === my) return [];
  const seen = new Set(), out = [];
  for (const id of P.s[my].h){ const k = typeOfId(id); if (!seen.has(k) && canCounter(k, top.a)){ seen.add(k); out.push({id, for:-1, label:esc(ACTS[k].name), sub:esc(ACTS[k].text)}); } }
  return out.concat(jrOptions(sub, my));
}
function jrOptions(sub, my){
  const id = P.s[my].h.find(x => typeOfId(x) === 'jr');
  if (id === undefined || !sub.base.tg.includes(my) || sub.base.src === my) return [];
  if (sub.mt){
    const ch = (sub.sh && sub.sh[my]) || [];
    if (ch.length % 2 === 1 || (ch.length && ch[ch.length - 1][1] === my)) return [];
  } else {
    const topS = sub.ch.length ? sub.ch[sub.ch.length - 1][1] : sub.base.src;
    if (sub.ch.length % 2 === 1 || topS === my) return [];
  }
  const note = 'The top card of the deck is revealed. A Henry VIII Clause loses; Election Interference wins.';
  return [{id, for:my, guess:'b', label:'Judicial Review: predict a bill card', sub:note},
          {id, for:my, guess:'a', label:'Judicial Review: predict an action card', sub:note}];
}
function shieldList(sub){
  if (!sub.mt) return '';
  const rows = sub.base.tg.filter(t => sub.sh && sub.sh[t] && sub.sh[t].length).map(t => {
    const ch = sub.sh[t], on = ch.length % 2 === 1, by = seatName(ch[ch.length - 1][1]);
    return `<li>${esc(seatName(t))}: ${on ? `shielded by ${esc(by)}` : `shield cancelled by ${esc(by)}`}</li>`;
  }).join('');
  return rows ? `<ol class="chain">${rows}</ol>` : '';
}
function autoPass(){
  if (!P || !P.sub || P.sub.k !== 'resp' || P.ph !== 'play' || P.pz) return;
  const sub = P.sub, my = mySeat();
  if (my < 0 || P.s[my].o) return;
  const key = respKey(sub);
  if ((sub.last ? sub.last[1] : sub.base.src) === my || (sub.ps || []).includes(my) || ui.passKey === key || ui.autoKey === key) return;
  if (!myCounters(sub).length){
    ui.autoKey = key;
    const at = sub.ver;
    const wait = Math.max(0, local(sub.pop || 0) + TIME.pop - Date.now());
    setTimeout(() => { if (P && !P.pz && P.sub && respKey(P.sub) === key){ ui.passKey = key; send({k:'rpass', at}); } }, wait + 1500 + Math.random() * 2000);
  }
}

function pauseView(my){
  const pz = P.pz, by = seatName(pz.by);
  const meIn = my >= 0 && !P.s[my].o;
  let btn = '';
  if (meIn && my === pz.by) btn = '<button type="button" class="btn brass" data-act="unpause">Resume</button>';
  else if (meIn) btn = `<button type="button" class="btn brass" data-act="unpause" data-unlock="${local(pz.at) + PAUSE_LOCK}" disabled>Resume</button>`;
  return `<div class="modal paused"><div class="mbox">
    <p class="eyebrow">Order! Order!</p>
    <h2>Paused by ${esc(by)}</h2>
    <p class="muted">All clocks are stopped. ${meIn && my !== pz.by ? `${esc(by)} can resume at any time. Anyone else can after 30 seconds.` : 'You can resume whenever you are ready.'}</p>
    <div class="mrow"><button type="button" class="btn ghost" data-act="rules">Read the rules</button><button type="button" class="btn ghost" data-act="log">Hansard</button></div>
    ${btn}
  </div></div>`;
}
function modalView(my){
  if (!P) return '';
  if (P.br && P.ph === 'play' && my >= 0 && !(P.br.rd || []).includes(my) && ui.briefKey !== P.c + ':' + P.br.until) return briefView();
  if (P.pz && P.ph === 'play') return pauseView(my);
  if (P.ph === 'over'){
    const w = P.win;
    const rows = P.s.map(s => `<li class="${ROLE[s.r].side === w ? 'won' : ''}"><span>${esc(s.nm)}</span><span class="role r-${s.r}">${ROLE[s.r].name}</span><span class="muted">${s.bl.length} bill${s.bl.length === 1 ? '' : 's'}</span></li>`).join('');
    const mine = my >= 0 && ROLE[P.s[my].r].side === w;
    return `<div class="modal over"><div class="mbox">
      <p class="eyebrow">${mine ? 'Your side carries the House' : 'The House has divided'}</p>
      <h2 class="win w-${w}">${SIDE[w]} wins</h2>
      <p>${esc(P.why || '')}</p>
      <ul class="results">${rows}</ul>
      <div class="mrow">
        ${mode === 'host' ? '<button type="button" class="btn brass" data-act="again">New sitting, same players</button>' : ''}
        ${mode === 'solo' ? '<button type="button" class="btn brass" data-act="again">Play again</button>' : ''}
        <button type="button" class="btn ghost" data-act="leave">Leave</button>
      </div></div></div>`;
  }
  const sub = P.sub;
  if (sub && sub.k === 'elec' && inPop(sub)) return elecPopView(sub);
  if (sub && sub.k === 'resp' && inPop(sub)) return popView(sub);
  if (!sub || my < 0 || P.s[my].o) return '';
  if (sub.k === 'resp'){
    const key = respKey(sub), cs = myCounters(sub);
    if (!cs.length || ui.passKey === key || (sub.ps || []).includes(my)) return '';
    const top = topOf(sub);
    const what = sub.mt ? bannerLine(sub.base) : sub.ch.length ? `${esc(seatName(top.s))} answers with ${esc(ACTS[top.a].name)}.` : bannerLine(sub.base);
    return `<div class="modal"><div class="mbox respbox">
      <p class="eyebrow">Point of order</p>
      <h2>${what}</h2>
      <p class="muted">${sub.mt ? 'Parliamentary Sovereignty shields one targeted player. Anyone may play it, for themselves or for someone else.' : 'You can answer this. Anyone at the table may.'}</p>
      ${shieldList(sub)}
      ${timerBar(sub.dl, TIME.resp)}
      <div class="counters">${cs.map(o => `<button type="button" class="btn counter" data-act="counter" data-id="${o.id}" data-for="${o.for}" data-guess="${o.guess || ''}"><b>${o.label}</b><small>${o.sub}</small></button>`).join('')}</div>
      <button type="button" class="btn ghost" data-act="letpass">Let it pass</button>
    </div></div>`;
  }
  if (sub.k === 'trade' && (sub.tgt === my || (sub.tgt === -1 && sub.src !== my && !(sub.dec || []).includes(my)))){
    const want = Object.entries(sub.want);
    const can = want.every(([k, v]) => countType(P.s[my].h, k) >= v);
    return `<div class="modal"><div class="mbox">
      <p class="eyebrow">${sub.tgt === -1 ? 'Open trade offer' : 'Trade offer'}</p><h2>${esc(seatName(sub.src))} proposes a deal${sub.tgt === -1 ? ' to everyone' : ''}</h2>
      ${sub.tgt === -1 ? '<p class="muted">The first player to accept gets it.</p>' : ''}
      ${timerBar(sub.dl, TIME.trade)}
      <div class="tradecols">
        <div><h3>You receive</h3>${sub.give.length ? `<div class="chips">${sub.give.map(id => chip(typeOfId(id))).join('')}</div>` : '<p class="muted">Nothing</p>'}</div>
        <div><h3>You give</h3>${want.length ? `<div class="chips">${want.map(([k, v]) => `${chip(k)}<span class="times">×${v}</span>`).join('')}</div>` : '<p class="muted">Nothing</p>'}</div>
      </div>
      ${can ? '' : '<p class="warnline">You do not hold the cards asked for.</p>'}
      <div class="mrow"><button type="button" class="btn brass" data-act="taccept" ${can ? '' : 'disabled'}>Accept</button><button type="button" class="btn ghost" data-act="treject">Decline</button></div>
    </div></div>`;
  }
  if (sub.k === 'talks' && sub.src === my){
    const tgt = P.s[sub.tgt], t = ui.talks;
    const even = t.mine.length === t.theirs.length;
    return `<div class="modal"><div class="mbox wide">
      <p class="eyebrow">Cross-Party Talks</p><h2>${esc(tgt.nm)}’s hand</h2>
      <p class="muted">Pick up to ${sub.n} of theirs and the same number of yours to swap.</p>
      ${timerBar(sub.dl, TIME.talks)}
      <h3>Theirs (${t.theirs.length}/${sub.n})</h3>
      <div class="minis">${tgt.h.map(id => cardFace(id, {act:'tktheirs', sel:t.theirs.includes(id), plain:true})).join('')}</div>
      <h3>Yours (${t.mine.length}/${sub.n})</h3>
      <div class="minis">${P.s[my].h.map(id => cardFace(id, {act:'tkmine', sel:t.mine.includes(id)})).join('')}</div>
      <div class="mrow"><button type="button" class="btn brass" data-act="tkdone" ${even ? '' : 'disabled'}>${t.mine.length ? `Swap ${t.mine.length}` : 'No deal'}</button></div>
    </div></div>`;
  }
  if (sub.k === 'elec' && sub.src === my){
    if (ui.elecKey !== sub.pop){ ui.elecKey = sub.pop; ui.elecPick = []; }
    const n = ui.elecPick.length;
    return `<div class="modal"><div class="mbox wide">
      <p class="eyebrow">Election Interference</p><h2>Take ${sub.n} of the top ${sub.cards.length} cards</h2>
      <p class="muted">The rest are shuffled back into the deck. If time runs out, the best-looking cards are picked for you.</p>
      ${timerBar(sub.dl, TIME.pop + TIME.elec)}
      <div class="minis">${sub.cards.map(id => cardFace(id, {act:'elpick', sel:ui.elecPick.includes(id)})).join('')}</div>
      <div class="mrow"><button type="button" class="btn brass" data-act="eldone" ${n === sub.n ? '' : 'disabled'}>Take ${n} of ${sub.n}</button></div>
    </div></div>`;
  }
  if (sub.k === 'fund' && sub.wait.includes(my)){
    return `<div class="modal"><div class="mbox wide">
      <p class="eyebrow">Party Funding</p><h2>Give ${esc(seatName(sub.src))} one card</h2>
      <p class="muted">If you do not choose in time, a random card goes.</p>
      ${timerBar(sub.dl, TIME.fund)}
      <div class="minis">${P.s[my].h.map(id => cardFace(id, {act:'donate'})).join('')}</div>
    </div></div>`;
  }
  return '';
}
function elecPopView(sub){
  return `<div class="pop" aria-live="polite"><div class="popbox camp-F">
    <p class="pop-who">Election Interference!</p>
    <div class="card act popcard elec"><span class="c-kind">Drawn and played at once</span>${art('elec')}<span class="c-name">${esc(ELEC.name)}</span><span class="c-text">The Foreign Power takes 5 of the top 10 cards.</span></div>
    <p class="pop-on">${esc(seatName(sub.src))} looks at the top ${sub.cards.length} cards.</p>
  </div></div>`;
}
function inPop(sub){ return sub.pop != null && Date.now() < local(sub.pop) + TIME.pop; }
function popView(sub){
  const b = sub.base;
  const top = sub.mt && sub.last ? {a:sub.last[0], s:sub.last[1]} : topOf(sub), d = ACTS[top.a];
  let line = (sub.mt ? sub.last : sub.ch.length) ? `${esc(seatName(top.s))} answers with` : `${esc(seatName(top.s))} plays`;
  if (sub.mt && sub.last){
    const t = sub.last[2], ch = sub.sh[t] || [];
    line = ch.length % 2 ? `${esc(seatName(top.s))} shields ${t === top.s ? 'themselves' : esc(seatName(t))}` : `${esc(seatName(top.s))} cancels the shield on ${esc(seatName(t))}`;
  }
  if (!(sub.mt ? sub.last : sub.ch.length) && b.defl) line = 'Royal Intervention turns the rejection back';
  if (sub.last && sub.last[0] === 'jr'){
    const r = sub.last;
    return `<div class="pop" aria-live="polite"><div class="popbox camp-${P.s[r[1]] ? ROLE[P.s[r[1]].r].side : 'G'}">
      <p class="pop-who">${esc(seatName(r[1]))} seeks Judicial Review</p>
      <div class="card act k-d popcard"><span class="c-kind">Defence</span>${art('jr')}<span class="c-name">Judicial Review</span><span class="c-text">Predicted ${r[5] === 'a' ? 'an action card' : 'a bill card'}.</span></div>
      <p class="pop-on">The top card is ${esc(r[4] ? typeName(r[4]) : 'nothing')}. <b>${r[3] ? 'The claim succeeds.' : 'The claim fails.'}</b></p>
    </div></div>`;
  }
  let on = '';
  if (!(sub.mt ? sub.last : sub.ch.length) && b.a === 'fund') on = 'Every other player must give a card.';
  else if (!(sub.mt ? sub.last : sub.ch.length) && b.tg && b.tg.length) on = `on ${b.tg.map(t => esc(seatName(t))).join(' and ')}${b.bt ? `’s ${esc(BILL[b.bt].name)}` : ''}`;
  const camp = P.s[top.s] ? ROLE[P.s[top.s].r].side : 'G';
  return `<div class="pop" aria-live="polite"><div class="popbox camp-${camp}">
    <p class="pop-who">${line}</p>
    <div class="card act k-${d.kind} popcard"><span class="c-kind">${d.kind === 'm' ? 'Manoeuvre' : 'Defence'}</span>${art(top.a)}<span class="c-name">${esc(d.name)}</span><span class="c-text">${esc(BRIEF[top.a] || '')}</span></div>
    ${on ? `<p class="pop-on">${on}</p>` : ''}
  </div></div>`;
}
function bannerLine(b){
  if (b.a === 'fund') return `${esc(seatName(b.src))} plays Party Funding on everyone.`;
  let line = `${esc(seatName(b.src))} plays ${esc(ACTS[b.a].name)}`;
  if (b.tg && b.tg.length) line += ` on ${b.tg.map(t => esc(seatName(t))).join(' and ')}`;
  if (b.bt) line += `’s ${esc(BILL[b.bt].name)}`;
  return line + '.';
}

function sheetView(){
  if (!ui.sheet) return '';
  let body = '';
  if (ui.sheet === 'rules') body = rulesBody();
  else if (ui.sheet === 'log') body = `<h2>Hansard</h2><ol class="hansard">${(P && P.log || []).slice().reverse().map(l => `<li>${esc(l)}</li>`).join('')}</ol>`;
  else if (ui.sheet === 'card' && P && ui.sel != null && myHand().includes(ui.sel)) body = cardSheet(ui.sel);
  else if (ui.sheet === 'trade' && P) body = tradeSheet();
  else if (ui.sheet === 'seat' && P && P.s) body = seatSheet(ui.seatI);
  else if (ui.sheet === 'guide') body = `<h2>Quick guide</h2>${guideBody(false)}`;
  else if (ui.sheet === 'billpick' && P && ui.billPick != null){
    const s = P.s[ui.billPick];
    body = `<h2>Which of ${esc(s.nm)}’s bills?</h2><div class="stack">${s.bl.split('').map((k, bi) => `<button type="button" class="btn ghost billopt" data-act="bill" data-i="${ui.billPick}" data-bi="${bi}">${chip(k)} ${esc(BILL[k].name)}</button>`).join('')}</div>`;
  } else { ui.sheet = null; return ''; }
  return `<div class="sheet-wrap" data-act="closesheet"><section class="sheet" data-stop="1" role="dialog" aria-modal="true">
    <button type="button" class="sheet-x" data-act="closesheet" aria-label="Close">Close</button>${body}</section></div>`;
}

function cardSheet(id){
  const c = cat()[id], hand = myHand();
  if (c.t === 'w'){
    const opts = BILLS.filter(b => canPassWith(hand, b.k));
    const free = myTurnFree();
    return `<div class="bigcard">${cardFace(id, {act:'noop'})}</div>
      <h2>${esc(WILD.name)}</h2><p>${esc(WILD.text)}</p><p class="flav">${esc(WILD.flav)}</p>
      ${opts.length ? `<h3>Bills you can pass now</h3><div class="stack">${opts.map(b => { const r = Math.min(countType(hand, b.k), b.set); return `<button type="button" class="btn ghost billopt" data-act="passbill" data-k="${b.k}" ${free ? '' : 'disabled'}>${chip(b.k)} ${esc(b.name)} <small class="muted">${r} real + ${b.set - r} wild</small></button>`; }).join('')}</div>${free ? '' : '<p class="muted small">You can pass bills on your turn.</p>'}`
        : '<p class="note">Hold at least one real card of a bill, and enough Henry VIII Clauses to make up the rest of its set.</p>'}`;
  }
  if (c.t === 'b'){
    const b = BILL[c.k], have = countType(hand, c.k), w = wildsIn(hand);
    const ok = canPassWith(hand, c.k), can = myTurnFree() && ok;
    const useW = Math.max(0, b.set - Math.min(have, b.set));
    const label = ok ? (useW ? `Pass in the Commons (${useW} wild)` : 'Pass in the Commons') : `You hold ${have} of ${b.set}${w ? ` +${w} wild` : ''}`;
    return `<div class="bigcard">${cardFace(id, {act:'noop'})}</div>
      <h2>${esc(b.name)}</h2>
      <p>Collect ${b.set} cards of this bill, then pass it as one move. Henry VIII Clauses can fill missing slots. Passed bills sit on your seat and count for your side. The same bill can be passed twice.</p>
      <button type="button" class="btn brass" data-act="passbill" data-k="${c.k}" ${can ? '' : 'disabled'}>${label}</button>`;
  }
  const a = ACTS[c.k];
  let btn = '';
  if (a.kind === 'm'){
    let why = '';
    if (!myTurnFree()) why = 'Wait for your turn';
    else if (c.k === 'vonc' && !P.fb) why = 'Not until the first bill has passed';
    else if (a.tgt === 'bill' && !P.s.some((s, i) => i !== mySeat() && !s.o && s.bl.length)) why = 'Nobody else has a Commons-passed bill';
    btn = `<button type="button" class="btn brass" data-act="playcard" data-id="${id}" ${why ? 'disabled' : ''}>${why || 'Play this card'}</button>`;
  } else {
    const vs = a.vs.includes('*') ? 'any action card' : a.vs.map(k => ACTS[k].name).join(' or ');
    btn = `<p class="note">Keep this card. When someone plays ${esc(vs)}, you get the chance to answer, even on another player’s turn. Answering does not use a move.</p>`;
  }
  return `<div class="bigcard">${cardFace(id, {act:'noop'})}</div>
    <h2>${esc(a.name)}</h2><p>${esc(a.text)}</p><p class="flav">${esc(a.flav)}</p>${btn}`;
}

function tradeSheet(){
  const my = mySeat(), t = ui.trade;
  const partners = P.s.map((s, i) => ({s, i})).filter(x => x.i !== my && !x.s.o);
  const types = BILLS.map(b => b.k).concat(['wild'], Object.keys(ACTS));
  const ok = t.tg != null && (t.give.length || Object.values(t.want).some(v => v > 0));
  return `<h2>Offer a trade</h2>
    <p class="muted small">A trade uses a move only if it is accepted. They can accept or decline, not counter.</p>
    <h3>With</h3>
    <div class="partners"><button type="button" class="pill${t.tg === -1 ? ' on' : ''}" data-act="tpartner" data-i="-1">Everyone <small>first to accept</small></button>${partners.map(x => `<button type="button" class="pill camp-${ROLE[x.s.r].side}${t.tg === x.i ? ' on' : ''}" data-act="tpartner" data-i="${x.i}">${esc(x.s.nm)} <small>${ROLESHORT[x.s.r]}</small></button>`).join('')}</div>
    <h3>You give <span class="muted">${t.give.length} card${t.give.length === 1 ? '' : 's'}</span></h3>
    <div class="minis">${P.s[my].h.map(id => cardFace(id, {act:'tgive', sel:t.give.includes(id)})).join('') || '<p class="muted">No cards.</p>'}</div>
    <h3>You ask for</h3>
    <div class="wants">${types.map(k => { const v = t.want[k] || 0; return `<div class="want${v ? ' on' : ''}">${chip(k)}<span class="step"><button type="button" data-act="wminus" data-k="${k}" aria-label="Fewer">−</button><b>${v}</b><button type="button" data-act="wplus" data-k="${k}" aria-label="More">+</button></span></div>`; }).join('')}</div>
    <div class="sheet-foot"><button type="button" class="btn brass" data-act="tsend" ${ok ? '' : 'disabled'}>Send offer</button></div>`;
}

function rulesBody(){
  const acts = Object.values(ACTS).map(a => `<li><b>${esc(a.name)}</b> <span class="kindtag">${a.kind === 'm' ? 'Manoeuvre' : 'Defence'}</span><br>${esc(a.text)}</li>`).join('');
  const bills = BILLS.map(b => `<li>${chip(b.k)} ${esc(b.name)} <span class="muted">set of ${b.set}, ${b.set + 2} in the deck</span></li>`).join('');
  return `<h2>How to play</h2>
  ${P && P.s ? '<button type="button" class="btn ghost" data-act="guide">Open the quick guide</button>' : ''}
  <h3>Sides</h3>
  <ul class="rules">
    <li><b>Government</b> (the Prime Minister and Government MPs) wins by passing 3 bills between them.</li>
    <li><b>Opposition</b> wins by passing 2 bills, or by bringing down the Prime Minister.</li>
    <li><b>Foreign Power</b> plays alone and wins by passing 3 bills before the Government does.</li>
    <li>If every Opposition MP loses their seat, the Government wins. All roles are public.</li>
  </ul>
  <h3>Each side’s advantages</h3>
  <ul class="rules">
    <li><b>Government:</b> the most seats at the table, and the Prime Minister draws 3 cards a turn.</li>
    <li><b>Opposition:</b> needs only 2 bills to win.</li>
    <li><b>Foreign Power:</b> draws 4 cards a turn, and Election Interference hands it 5 of the top 10 cards.</li>
  </ul>
  <h3>Your turn</h3>
  <ul class="rules">
    <li>Draw 2 cards. The Prime Minister draws 3 and the Foreign Power draws 4.</li>
    <li>Make up to 3 moves: play a manoeuvre card, pass a bill, or make a trade that is accepted. You have 2 minutes.</li>
    <li>Trades go to one player or to the whole House. On an open offer, the first player to accept gets the deal.</li>
    <li>Defence cards are played in answer to someone else’s card, by anyone, on any turn. Everyone has 30 seconds to answer. Answering is not a move. Answers can be answered in turn.</li>
    <li>Anyone still in the game can pause at any time. The player who paused can resume at once; everyone else can after 30 seconds. All clocks stop while paused.</li>
    <li>No hand limit. When the deck is down to 10 cards, the discard pile is shuffled back in.</li>
  </ul>
  <h3>Bills</h3><ul class="rules plain">${bills}<li>${chip('wild')} <b>${esc(WILD.name)}</b> <span class="muted">wild, 10 in the deck (plus 1 per extra player)</span><br>${esc(WILD.text)}</li></ul>
  <p class="muted small">Bills on the table have passed the Commons but still await the Lords and Royal Assent, so they can be knocked out. The same bill can be passed twice. A knocked-out bill sends all its cards, wilds included, to the discard pile. A bill taken by Confidence and Supply keeps its wilds.</p>
  <h3>Action cards</h3><ul class="rules plain">${acts}<li><b>${esc(ELEC.name)}</b> <span class="kindtag">Triggered on draw, 5 in the deck</span><br>${esc(ELEC.text)} If the Foreign Power has lost its seat, it has no effect.</li></ul>
  <p class="muted small">Larry the Chief Mouser and Election Interference cannot be stopped. Against Coalition Agreement or Party Funding, Parliamentary Sovereignty shields one player: the card still hits everyone else. A shield can itself be cancelled by another Parliamentary Sovereignty. Judicial Review is only for the player a card is aimed at: predict bill or action, and the top card of the deck is revealed and discarded. Prorogation costs your whole hand as soon as you play it. A Lords’ Rejection turned back by Royal Intervention knocks out the most recent bill of the player who used it.</p>`;
}

/* ---------- events ---------- */
app.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'closesheet' && ev.target.closest('[data-stop]') && !ev.target.closest('.sheet-x')) return;
  if (el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id != null ? Number(el.dataset.id) : null;
  const i = el.dataset.i != null ? Number(el.dataset.i) : null;
  switch (act){
    case 'host': hostNew(); break;
    case 'join': { const c = document.getElementById('code'); guestJoin(c ? c.value : ''); break; }
    case 'rejoin': guestJoin(el.dataset.code); break;
    case 'resume': hostResume(); break;
    case 'solo': startSolo(); break;
    case 'rules': ui.sheet = 'rules'; render(); break;
    case 'log': ui.sheet = 'log'; render(); break;
    case 'closesheet': ui.sheet = null; ui.billPick = null; render(); break;
    case 'count': if (lobby){ lobby.n = Number(el.dataset.n); publish(); } break;
    case 'start': hostStart(); break;
    case 'leave': leave(); break;
    case 'again': backToLobby(); break;
    case 'card':
      if (ui.aim) return;
      ui.sel = id; ui.sheet = 'card'; render(); break;
    case 'passbill': ui.sheet = null; ui.sel = null; send({k:'pass', b:el.dataset.k}); break;
    case 'playcard': {
      const k = typeOfId(id), tgt = ACTS[k].tgt;
      ui.sheet = null; ui.sel = null;
      if (tgt === 'none') send({k:'play', card:id});
      else { ui.aim = {card:id, k, kind:tgt, picks:[]}; render(); }
      break;
    }
    case 'cancelaim': ui.aim = null; render(); break;
    case 'seat': onSeat(i); break;
    case 'bill': {
      ev.stopPropagation();
      const bi = Number(el.dataset.bi);
      if (ui.aim && (ui.aim.kind === 'bill' || ui.aim.kind === 'vonc') && validAimSeat(ui.aim, i)){
        const a = ui.aim; ui.aim = null; ui.sheet = null; ui.billPick = null;
        send({k:'play', card:a.card, tg:[i], bi});
      } else if (!ui.aim){ const k = P.s[i].bl[bi]; toast(`${BILL[k].name}, passed by the Commons for ${P.s[i].nm}. Awaiting the Lords.`); }
      else onSeat(i);
      break;
    }
    case 'end': ui.aim = null; send({k:'end'}); break;
    case 'tradeopen': ui.trade = {tg:null, give:[], want:{}}; ui.sheet = 'trade'; render(); break;
    case 'tpartner': ui.trade.tg = i; render(); break;
    case 'tgive': toggle(ui.trade.give, id); render(); break;
    case 'wplus': ui.trade.want[el.dataset.k] = Math.min(10, (ui.trade.want[el.dataset.k] || 0) + 1); render(); break;
    case 'wminus': ui.trade.want[el.dataset.k] = Math.max(0, (ui.trade.want[el.dataset.k] || 0) - 1); render(); break;
    case 'tsend': {
      const w = {}; Object.entries(ui.trade.want).forEach(([k, v]) => { if (v > 0) w[k] = v; });
      ui.sheet = null; send({k:'trade', tg:ui.trade.tg, give:ui.trade.give.slice(), want:w}); break;
    }
    case 'counter': if (P && P.sub && P.sub.k === 'resp'){ ui.passKey = respKey(P.sub); send({k:'resp', card:id, at:P.sub.ver, for:Number(el.dataset.for), guess:el.dataset.guess || undefined}); } break;
    case 'letpass': if (P && P.sub && P.sub.k === 'resp'){ ui.passKey = respKey(P.sub); send({k:'rpass', at:P.sub.ver}); render(); } break;
    case 'taccept': send({k:'tans', yes:true}); break;
    case 'treject': send({k:'tans', yes:false}); break;
    case 'tktheirs': { const n = P.sub ? P.sub.n : 2; toggleMax(ui.talks.theirs, id, n); render(); break; }
    case 'tkmine': { const n = P.sub ? P.sub.n : 2; toggleMax(ui.talks.mine, id, n); render(); break; }
    case 'tkdone': send({k:'talks', mine:ui.talks.mine.slice(), theirs:ui.talks.theirs.slice()}); ui.talks = {mine:[], theirs:[]}; break;
    case 'donate': send({k:'give', card:id}); break;
    case 'sololvl': ui.soloLvl = Number(el.dataset.n); LS.set('oo-lvl', ui.soloLvl); render(); break;
    case 'lobbylvl': if (lobby){ lobby.lvl = Number(el.dataset.n); publish(); } break;
    case 'guide': ui.sheet = 'guide'; render(); break;
    case 'briefready': if (P && P.br){ ui.briefKey = P.c + ':' + P.br.until; send({k:'ready'}); render(); } break;
    case 'pause': ui.aim = null; ui.sheet = null; send({k:'pause'}); break;
    case 'unpause': send({k:'resume'}); break;
    case 'elpick': { const n = P.sub ? P.sub.n : 5; toggleMax(ui.elecPick, id, n); render(); break; }
    case 'eldone': send({k:'elec', pick:ui.elecPick.slice()}); break;
  }
});
app.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'code'){ guestJoin(ev.target.value); }
  else if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.seat')){ ev.preventDefault(); onSeat(Number(ev.target.dataset.i)); }
  else if (ev.key === 'Escape' && ui.sheet){ ui.sheet = null; render(); }
});
app.addEventListener('input', ev => {
  if (ev.target.id === 'nm') me.nm = ev.target.value;
  if (ev.target.id === 'code'){ ev.target.value = ev.target.value.toUpperCase(); ui.joinCode = ev.target.value; }
});
function toggle(arr, v){ const j = arr.indexOf(v); if (j >= 0) arr.splice(j, 1); else arr.push(v); }
function toggleMax(arr, v, n){ const j = arr.indexOf(v); if (j >= 0) arr.splice(j, 1); else if (arr.length < n) arr.push(v); }

function onSeat(i){
  const aim = ui.aim; if (!P || !P.s) return;
  if (!aim){ ui.seatI = i; ui.sheet = 'seat'; render(); return; }
  if (!validAimSeat(aim, i)){ toast(aim.kind === 'bill' ? 'That player has no Commons-passed bills.' : 'Choose another player still in the House.'); return; }
  const s = P.s[i];
  if (aim.kind === 'two'){
    toggle(aim.picks, i);
    if (aim.picks.length === 2){ ui.aim = null; send({k:'play', card:aim.card, tg:aim.picks.slice()}); }
    else render();
    return;
  }
  if ((aim.kind === 'bill' || aim.kind === 'vonc') && s.bl.length > 1){ ui.billPick = i; ui.sheet = 'billpick'; render(); return; }
  ui.aim = null;
  send({k:'play', card:aim.card, tg:[i], bi:0});
}

/* ---------- clocks ---------- */
function frame(){
  const real = Date.now();
  const now = P && P.pz ? local(P.pz.at) : real;
  app.querySelectorAll('[data-unlock]').forEach(el => {
    const left = Number(el.dataset.unlock) - real;
    el.disabled = left > 0;
    el.textContent = left > 0 ? `Resume (in ${Math.ceil(left / 1000)}s)` : 'Resume';
  });
  app.querySelectorAll('[data-dl]').forEach(el => {
    const dl = Number(el.dataset.dl), tot = Number(el.dataset.total);
    const left = Math.max(0, dl - now);
    const bar = el.querySelector('i'), txt = el.querySelector('span');
    if (bar) bar.style.transform = `scaleX(${Math.min(1, left / tot)})`;
    if (txt) txt.textContent = Math.ceil(left / 1000) + 's';
  });
  app.querySelectorAll('[data-tdl]').forEach(el => {
    const left = Math.max(0, Number(el.dataset.tdl) - now), sec = Math.ceil(left / 1000);
    el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    el.classList.toggle('low', sec <= 10);
  });
  if (mode === 'guest' && hostLostAt && now > hostLostAt && !ui.lostShown){ ui.lostShown = true; render(); }
  const popNow = !!(P && P.sub && (P.sub.k === 'resp' || P.sub.k === 'elec') && inPop(P.sub));
  if (popNow !== ui.popOn){ ui.popOn = popNow; render(); }
  requestAnimationFrame(frame);
}

ensureRoom();
render();
requestAnimationFrame(frame);
</script>
